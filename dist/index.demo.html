<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#355cf4">
  <title>Fieldnotes · 案例分析工作台</title>
  <style>
/* Offline writing desk: shared tokens for all ten steps and the evidence drawer. */
:root {
  --paper:#e5eaf3;
  --ink:#192c49;
  --muted:#5d708e;
  --line:#c5d2e5;
  --blue:#345dde;
  --accent:#e0edaa;
  --stage:#345dde;
  --stage-soft:#dfe8fc;
  --hero-start:#193c99;
  --hero-end:#5374ec;
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  font-synthesis:none;
  color:var(--ink);
  background:var(--paper)
}

:root[data-phase="deliberate"] {
  --stage:#6551c7;
  --stage-soft:#e9e2fa;
  --hero-start:#33296b;
  --hero-end:#8264d4
}

:root[data-phase="act"] {
  --stage:#177e73;
  --stage-soft:#d8ece7;
  --hero-start:#164750;
  --hero-end:#299c8c
}

:root[data-step="3"] {
  --stage:#157d83;
  --stage-soft:#d7eaed;
  --hero-start:#17465a;
  --hero-end:#3496a0
}

:root[data-step="2"] {
  --stage:#4e63b0;
  --stage-soft:#e0e5f4;
  --hero-start:#263969;
  --hero-end:#6980cd
}

:root[data-step="4"] {
  --stage:#946546;
  --stage-soft:#eee0d3;
  --hero-start:#563d3b;
  --hero-end:#b38766
}

:root[data-step="5"] {
  --stage:#7253bc;
  --stage-soft:#e8e0f4;
  --hero-start:#423169;
  --hero-end:#9972cc
}

:root[data-step="9"] {
  --stage:#ac6332;
  --stage-soft:#f0e0cd;
  --hero-start:#603b36;
  --hero-end:#bc7c48
}

:root[data-step="7"] {
  --stage:#8b5c81;
  --stage-soft:#eddfeb;
  --hero-start:#49334e;
  --hero-end:#a27f9b
}

:root[data-step="10"] {
  --stage:#427753;
  --stage-soft:#dfe9d6;
  --hero-start:#244b46;
  --hero-end:#709369
}

* {
  box-sizing:border-box
}
body {
  margin:0;
  font-size:14px;
  line-height:1.7
}
button,input,textarea,select {
  font:inherit;
  color:inherit
}
button {
  cursor:pointer;
  border:0;
  background:none
}
button:disabled {
  opacity:.4;
  cursor:default
}
a {
  color:var(--blue);
  text-decoration:none
}
h1,h2,h3,p {
  margin:0
}
h1,h2,h3 {
  line-height:1.45;
  font-weight:650
}
p,h3,blockquote {
  overflow-wrap:anywhere
}
button,a,input,textarea,select {
  -webkit-tap-highlight-color:transparent
}

button:focus-visible,a:focus-visible,summary:focus-visible {
  outline:3px solid #7595ef;
  outline-offset:4px
}
input:focus,textarea:focus,select:focus {
  outline:3px solid #93b0ec60;
  border-color:var(--stage)!important
}

.icon {
  width:19px;
  height:19px;
  flex:none;
  vertical-align:middle
}

.button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 17px;
  border:1px solid #becde4;
  border-radius:11px;
  background:#edf2fb;
  font-size:13px;
  font-weight:600;
  line-height:1.5;
  transition:background .18s,transform .18s,box-shadow .18s
}
.button:hover:not(:disabled) {
  background:#dce7fa;
  border-color:#9bafd6
}
.button:active:not(:disabled) {
  transform:translateY(1px)
}
.button.primary {
  background:var(--stage);
  color:white;
  border-color:var(--stage);
  box-shadow:0 4px 10px #18377516
}
.button.primary:hover:not(:disabled) {
  filter:brightness(1.08);
  background:var(--stage)
}
.button.quiet {
  background:transparent;
  border-color:transparent;
  color:var(--muted);
  box-shadow:none
}
.button.quiet:hover:not(:disabled) {
  background:#dce5f2;
  color:var(--ink)
}
.button.small {
  padding:9px 13px;
  font-size:12px
}
.button.icon-button {
  padding:9px;
  width:36px;
  height:36px;
  font-size:0;
  flex:none
}
.button.icon-button .icon {
  width:17px;
  height:17px
}

/* Navigation */
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:270px;
  padding:30px 18px 24px;
  color:#e8efff;
  background:radial-gradient(ellipse at 0 0,#263e6e 0%,transparent 60%),linear-gradient(165deg,#172a4c,#12233d);
  display:flex;
  flex-direction:column;
  z-index:10
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  color:white;
  padding:0 11px;
  font-size:26px;
  font-weight:700;
  letter-spacing:-1px;
  line-height:1.2
}
.brand-mark {
  width:39px;
  height:43px;
  border-radius:12px 12px 12px 3px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:#19324c;
  box-shadow:0 5px 15px #07172c40
}
.brand-mark .icon {
  width:24px;
  height:24px
}
.brand-sub {
  display:block;
  color:#b2c1dc;
  font-size:11px;
  font-weight:400;
  letter-spacing:.6px;
  margin-top:8px
}

.nav-heading {
  color:#b7c8e2;
  font-size:16px;
  font-weight:600;
  letter-spacing:.6px;
  margin:38px 15px 14px
}
.sidebar nav {
  flex:1;
  min-height:0;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#425c87 transparent
}
.step-nav {
  display:flex;
  align-items:center;
  width:100%;
  gap:12px;
  padding:12px 14px;
  margin:4px 0;
  color:#c7d5eb;
  border:1px solid transparent;
  border-radius:11px;
  text-align:left;
  transition:background .16s,color .16s
}
.step-nav:hover {
  background:#2a4167;
  color:white
}
.step-nav.active {
  color:white;
  background:var(--stage);
  border-color:#ffffff25;
  box-shadow:0 5px 16px #071a3333
}
.step-index {
  width:24px;
  flex:none;
  font-size:12px;
  color:#91aacd;
  font-variant-numeric:tabular-nums
}
.active .step-index {
  color:#ffffffc4
}
.step-name {
  flex:1;
  font-size:16px;
  line-height:1.55;
  font-weight:500
}
.step-class {
  flex:none;
  font-size:13px;
  line-height:1.2;
  padding:2px 6px;
  border-radius:999px;
  background:#ffffff22;
  color:inherit
}
.step-nav>.icon {
  width:14px;
  height:14px;
  color:var(--accent)
}
.nav-divider {
  color:#9eb2d2;
  font-size:11px;
  letter-spacing:1px;
  margin:23px 15px 10px
}
.revisit-dot {
  width:6px;
  height:6px;
  border-radius:50%;
  background:#f1b97d;
  flex:none
}

.sidebar-foot {
  display:flex;
  align-items:flex-start;
  gap:11px;
  margin:25px 9px 0;
  padding-top:22px;
  border-top:1px solid #45608560
}
.case-symbol {
  width:34px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:9px;
  background:#2b4265;
  color:#c6d7f0
}
.case-symbol .icon {
  width:17px
}
.sidebar-foot span {
  font-size:10px;
  color:#93adcf;
  letter-spacing:1.4px
}
.sidebar-foot h2 {
  font-size:13px;
  font-weight:500;
  color:#d6e1f2;
  margin-top:4px
}
.sidebar-foot p {
  font-size:11px;
  color:#99b0d0;
  margin-top:4px
}

/* Canvas and step header */
.main-shell {
  margin-left:270px;
  min-height:100vh;
  background:radial-gradient(ellipse at 100% 0,#cddbf6 0,transparent 55%),radial-gradient(ellipse at 10% 100%,#e2e8d5 0,transparent 48%),#dfe7f3
}
.topbar {
  min-height:91px;
  padding:20px 40px;
  background:#eaf0facc;
  border-bottom:1px solid #becde4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px
}
.page-identity>span {
  display:block;
  font-size:11px;
  color:#667b9c;
  margin-bottom:3px
}
.page-identity h2 {
  font-size:16px;
  white-space:nowrap
}
.top-actions {
  display:flex;
  align-items:center;
  gap:12px
}
.save-status {
  display:flex;
  align-items:center;
  gap:7px;
  color:#506884;
  font-size:12px;
  margin-right:5px;
  white-space:nowrap
}
.save-indicator {
  width:6px;
  height:6px;
  background:#368779;
  border-radius:50%
}
.save-status.warn {
  color:#995829;
  max-width:170px;
  line-height:1.5;
  white-space:normal
}
.warn .save-indicator {
  background:#bc7843
}

.language-switch {
  display:flex;
  padding:3px;
  background:#d8e3f3;
  border:1px solid #c4d2e8;
  border-radius:10px
}
.language-switch button {
  font-size:12px;
  padding:5px 9px;
  border-radius:7px;
  color:#5b7396
}
.language-switch .selected {
  background:#f4f7fc;
  color:#254bbf;
  box-shadow:0 2px 6px #22375312;
  font-weight:650
}
.material-button {
  padding:10px 13px;
  font-size:12px;
  color:#294ba3;
  background:#d9e4fc;
  border-color:#b9cbf0;
  white-space:nowrap
}
.material-button .icon {
  width:17px
}
.top-actions [data-action="materials"] {
  background:#1d355b;
  color:#f1f5ff;
  border-color:#1d355b
}
.top-actions [data-action="materials"]:hover {
  background:#304e7a;
  border-color:#304e7a
}
.top-actions [data-action="tools"] .icon {
  stroke-width:3
}

.workspace-layout {
  max-width:1220px;
  margin:0 auto;
  padding:32px 40px 40px
}
.step-hero {
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  min-height:218px;
  padding:32px 35px 38px;
  border-radius:20px;
  color:white;
  background:linear-gradient(115deg,var(--hero-start),var(--hero-end));
  box-shadow:0 12px 27px #233e7020
}
.hero-copy {
  flex:1;
  min-width:0;
  position:relative;
  z-index:1
}
.eyebrow {
  display:flex;
  align-items:center;
  gap:12px;
  color:#ffffffbf;
  font-size:12px;
  letter-spacing:.7px
}
.hero-badge {
  background:var(--accent);
  color:#243d45;
  padding:4px 9px;
  border-radius:6px;
  font-size:10px;
  font-weight:750;
  letter-spacing:1px
}
.step-hero h1 {
  font-size:clamp(29px,2.55vw,39px);
  letter-spacing:-1px;
  margin:21px 0 11px;
  font-weight:650
}
.step-hero p {
  max-width:620px;
  font-size:14px;
  color:#ffffffdc;
  line-height:1.9
}
.hero-progress {
  position:absolute;
  bottom:0;
  left:0;
  display:flex;
  gap:4px;
  width:100%;
  padding:0 35px 13px
}
.hero-progress span {
  height:3px;
  flex:1;
  border-radius:3px;
  background:#ffffff20
}
.hero-progress .filled {
  background:#dfeaaa
}

.hero-object {
  position:relative;
  width:225px;
  height:155px;
  flex:none;
  margin:0 -5px 0 26px
}
.orbit {
  position:absolute;
  border:1px solid #ffffff22;
  border-radius:50%;
  width:204px;
  height:204px;
  top:-25px;
  left:8px
}
.orbit-two {
  width:260px;
  height:260px;
  top:-53px;
  left:-20px
}
.hero-sheet {
  position:absolute;
  top:0;
  left:35px;
  width:135px;
  height:155px;
  border:1px solid #ffffffaa;
  border-radius:14px;
  padding:15px;
  background:linear-gradient(145deg,#f3f7ff,#d5e2f5);
  transform:rotate(-9deg);
  box-shadow:13px 10px 0 #ffffff20,0 15px 35px #0e24482b
}
.hero-sheet>span {
  color:#6d829e;
  font-size:8px;
  letter-spacing:1.5px;
  font-weight:700
}
.hero-sheet>.icon {
  display:block;
  width:43px;
  height:43px;
  color:var(--stage);
  margin:15px 0 14px;
  stroke-width:1.2
}
.sheet-lines {
  display:grid;
  gap:7px
}
.sheet-lines i {
  background:#b5c7df;
  height:3px;
  border-radius:2px;
  width:85%
}
.sheet-lines i:nth-child(2) {
  width:65%
}
.sheet-lines i:nth-child(3) {
  width:45%
}
.hero-stamp {
  position:absolute;
  right:10px;
  bottom:-2px;
  display:flex;
  align-items:baseline;
  gap:4px;
  background:var(--accent);
  color:#26484d;
  border:5px solid #ffffff25;
  padding:11px 14px;
  border-radius:13px;
  font-size:27px;
  line-height:1.2;
  font-weight:650;
  transform:rotate(7deg);
  box-shadow:0 5px 20px #172b4c20
}
.hero-stamp small {
  font-size:10px;
  font-weight:500
}

.workspace-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:40px;
  gap:15px;
  margin:27px 0 15px
}
.workspace-heading h2 {
  font-size:26px;
  letter-spacing:-.2px;
  display:flex;
  align-items:center;
  gap:11px
}
.workspace-heading h2:before {
  content:'';
  width:5px;
  height:26px;
  border-radius:4px;
  background:var(--stage)
}
.workspace-title-group {display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.step-hint-toggle {display:inline-flex;align-items:center;gap:6px;border:1px solid #bccde2;border-radius:9px;padding:6px 10px;font-size:11px;background:#eaf0f8;color:#537294;white-space:nowrap;}
.step-hint-toggle .icon {width:16px;height:16px;}
.step-hint-toggle:hover,.step-hint-toggle[aria-expanded="true"] {color:var(--stage);background:var(--stage-soft);border-color:var(--stage);}
.step-hint-panel {position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;gap:10px;padding:14px 18px;margin-bottom:14px;border:1px solid #c9d5df;border-radius:18px;background:linear-gradient(110deg,#f4edda,#eef2e8 60%,#e6eff3);box-shadow:0 5px 20px #183d5210;}
.step-hint-panel[hidden] {display:none;}
.step-hint-symbol {display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#e7dbaa;color:#8d713c;flex-shrink:0;}
.step-hint-symbol .icon {width:18px;height:18px;}
.step-hint-content {flex:1;min-width:0;}
.step-hint-top {position:absolute;top:14px;right:58px;display:flex;justify-content:flex-end;gap:10px;color:#77765c;font-size:11px;line-height:20px;}
.step-hint-top>span:last-child {font-variant-numeric:tabular-nums;white-space:nowrap;}
.step-hint-content h3 {font-size:18px;line-height:1.4;color:#344e43;padding-right:80px;margin-bottom:4px;}
.step-hint-content p {font-size:13.5px;color:#526657;line-height:1.65;}
.step-hint-content blockquote {padding:8px 12px;margin:8px 0;background:#fffcf0b0;border:1px solid #dedbc4;border-left:3px solid #b2a875;color:#465e4e;border-radius:0 12px 12px 0;font-size:13.5px;line-height:1.65;overflow-wrap:anywhere;}
.step-hint-content blockquote>span {display:block;font-size:11px;color:#857e59;margin-bottom:3px;}
.step-hint-actions {display:flex;gap:10px;flex-wrap:wrap;padding-top:2px;}
.step-hint-actions .button {display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;max-width:100%;font-size:13px;line-height:1.5;padding:8px 16px;border:1px solid #b9caba;border-radius:11px;background:#ffffffa6;color:#3e634c;white-space:normal;overflow-wrap:anywhere;}
.step-hint-actions .button:hover {background:#e2ebdf;border-color:#8caa92;}
.step-hint-actions #step-hint-next {min-width:148px;background:#426652;color:#fff;border-color:#426652;}
.step-hint-actions #step-hint-next:hover {background:#345440;}
.step-hint-actions .icon {width:18px;height:18px;flex-shrink:0;}
.step-hint-panel>.icon-button {position:absolute;top:8px;right:10px;width:34px;height:34px;flex-shrink:0;color:#6c806b;}
.workspace-layout:has(.step-hint-panel:not([hidden])) .step-hero {min-height:170px;padding-top:24px;padding-bottom:30px;}
.workspace-layout:has(.step-hint-panel:not([hidden])) .step-hero h1 {margin-top:12px;font-size:32px;}
.workspace-layout:has(.step-hint-panel:not([hidden])) .hero-object {transform:scale(.8);transform-origin:right center;}
.workspace-layout:has(.step-hint-panel:not([hidden])) .empty-state {min-height:190px;padding:22px;}
.entries {
  display:grid;
  gap:17px
}
.empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:280px;
  padding:28px;
  border:1px solid #b8c9e3;
  border-radius:17px;
  background:radial-gradient(ellipse at 50% 0,var(--stage-soft),transparent 75%),linear-gradient(130deg,#e7eef9,#f1eddf);
  box-shadow:0 5px 16px #29466608;
  text-align:center
}
.empty-art {
  width:76px;
  height:76px;
  margin-bottom:14px
}
.empty-art svg {
  width:100%;
  height:100%
}
.empty-state h3 {
  font-size:18px;
  margin-bottom:7px
}
.empty-state p {
  max-width:470px;
  font-size:13px;
  color:#596e8b;
  line-height:1.85;
  margin:0 auto 21px
}
.empty-state p:last-child {
  margin-bottom:0
}
.empty-state .button {
  padding:11px 23px
}

/* Writing and reasoning */
.entry-card,.review-card {
  background:linear-gradient(145deg,#f8faff,#edf2f9);
  border:1px solid #bfcfe5;
  border-radius:16px;
  padding:24px 27px;
  box-shadow:0 6px 20px #1d3c6810;
  position:relative
}
.entry-card {
  border-top:3px solid var(--stage)
}
.card-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px
}
.card-head>div {
  display:flex;
  align-items:center;
  gap:10px
}
.entry-number {
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  border-radius:9px;
  background:var(--stage-soft);
  color:var(--stage);
  font-size:16px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.entry-label {
  color:#516787;
  font-size:18px;
  font-weight:600
}
.card-head .icon-button {
  color:#7386a4
}

.field {
  display:block;
  margin-bottom:20px;
  min-width:0
}
.field:last-child {
  margin-bottom:0
}
.field>span {
  display:block;
  margin-bottom:9px;
  color:#4e6382;
  font-size:13px;
  font-weight:600
}
.field input,.field textarea,.field select,select[data-review] {
  width:100%;
  border:1px solid #bfcee3;
  border-radius:11px;
  background:#eaf0f8;
  padding:12px 15px;
  font-size:14px;
  line-height:1.85;
  transition:border-color .18s,background .18s
}
.field textarea {
  display:block;
  resize:vertical;
  min-height:119px
}
.field input,.field select {
  padding:9px 13px;
  min-height:44px
}
.field textarea::placeholder,.field input::placeholder {
  color:#7083a1;
  font-size:13px
}
.field input:focus,.field textarea:focus {
  background:#f5f8fc
}

.entry-details {
  border-top:1px solid #cbd7e9;
  margin-top:17px
}
.entry-details>summary {
  display:flex;
  align-items:center;
  gap:8px;
  padding:15px 0 2px;
  font-size:12px;
  color:#57708f;
  cursor:pointer;
  list-style:none
}
.entry-details>summary:before {
  content:'+';
  color:var(--stage);
  font-size:17px
}
.entry-details[open]>summary:before {
  content:'−'
}
.entry-details>summary span {
  background:#dfe7f3;
  color:#667c9a;
  font-size:10px;
  padding:0 6px;
  border-radius:4px
}
.entry-details .field {
  margin-top:14px
}
.two-columns {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:19px
}
.two-columns .field {
  margin-bottom:0
}

:root[data-step="5"] .two-columns>.field {
  background:#e6e3f0;
  border:1px solid #d5cee6;
  padding:17px;
  border-radius:12px

.check {

  align-items:flex-start;
  gap:9px;
  margin:12px 0;
  font-size:13px;
  color:#516681;
  cursor:pointer
}

  width:16px;
  height:16px;

}
.entry-card h3 {
  font-size:17px;
  line-height:1.75;
  margin:10px 0 18px
}
.is-core {

  border-color:#8ba9e3;

}
.tag {

}
.tag.muted {
  background:#dfe6f1;
  color:#5d7394
}
.tag.linked-tag {
  background:#dceee7;
  color:#257564
}
.record-id {
  display:none
}

.notice {
  display:flex;
  align-items:flex-start;
  gap:10px;
  border:1px solid #ddc6a7;
  background:#f1e6d3;
  padding:14px 18px;
  color:#896030;
  border-radius:11px;
  font-size:13px
}
.notice strong {
  font-size:13px;
  font-weight:500
}
.notice .icon {
  width:17px;
  height:17px;
  margin-top:3px
}

.evidence-intro {
  display:flex;
  align-items:center;
  gap:14px;
  border:1px solid #b6d2d9;
  background:#d4e6e9;
  border-radius:14px;
  padding:20px
}
.evidence-intro>div {
  flex:1;
  min-width:0
}
.evidence-intro h3 {
  color:#205b67;
  font-size:16px;
  margin-bottom:4px
}
.evidence-intro p {
  color:#486d7a;
  font-size:12px
}
.evidence-icon {
  width:42px;
  height:46px;
  display:grid;
  place-items:center;
  background:#bcd9d7;
  color:#24737b;
  border-radius:12px;
  flex:none
}

.fact-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start
}
.fact-grid.single { grid-template-columns:1fr; }
.selected-fact-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.selected-fact-head > div { display:flex; flex-wrap:wrap; gap:5px; }
.gap-prompt { color:#607491; padding:16px 20px; border:1px dashed #b5c8dd; border-radius:12px; background:#e5edf5; font-size:13px; }
.section-label {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  font-size:13px;
  font-weight:600;
  color:#476788
}
.section-label span {
  display:grid;
  place-items:center;
  min-width:22px;
  height:22px;
  border-radius:6px;
  background:#ffffff70;
  font-size:11px
}
.fact-card {
  margin-top:0;
  padding:20px 22px;
  border:1px solid #bdcee0;
  border-radius:14px;
  background:#eaf2f4;
  border-top:3px solid #4c9398;
  min-width:0
}
.fact-card>p {
  font-size:13px;
  line-height:1.85;
  margin:10px 0 13px
}
.fact-card .source-details>summary {
  font-size:11px;
  flex-wrap:wrap
}
.fact-card .source-review {
  margin-left:0
}
.fact-card .button {
  font-size:11px;
  padding:8px 6px
}
.fact-card .button.icon-button { font-size:0; }
.entry-details[id^="actors-"] .field > span { display:none; }
.skip-link { position:absolute; top:8px; left:8px; transform:translateY(-150%); z-index:200; padding:10px 16px; border-radius:8px; background:#edf3fc; color:#294ba3; }
.skip-link:focus { transform:translateY(0); }

.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:12px 0 2px
}
.section-heading h3 {
  font-size:16px
}
.basis-box {
  border:1px solid #c3d3e9;
  border-radius:12px;
  padding:16px 18px;
  background:#e0e9f6
}
.basis-box>p {
  color:#5a7090;
  font-size:13px;
  margin:9px 0 12px
}
.relation {
  display:flex;
  align-items:flex-start;
  gap:9px;
  border-top:1px solid #cad8e7;
  padding:13px 0;
  font-size:12px
}
.relation>.icon {
  width:15px;
  height:15px;
  color:#40808b;
  margin-top:3px
}
.relation>div {
  flex:1;
  min-width:0
}
.relation strong {
  color:#3c6274;
  font-weight:600
}
.relation p {
  color:#60778b;
  font-size:12px;
  margin-top:4px
}

.word-shelf {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  padding:15px 18px;
  border:1px solid #c5d1e2;
  border-radius:13px;
  background:#e8edf6
}
.word-shelf>span {
  color:#5b6e89;
  font-size:12px;
  margin-right:4px
}
.word-chip {
  display:flex;
  align-items:center;
  gap:8px;
  background:#dce6fc;
  border:1px solid #b9cced;
  border-radius:8px;
  padding:8px 13px;
  color:#345a98;
  font-size:12px
}
.word-chip:nth-of-type(2) {
  background:#e5dcf3;
  border-color:#cebee6;
  color:#6d4e9c
}
.word-chip:nth-of-type(3) {
  background:#d4e8df;
  border-color:#b3d0c3;
  color:#326e5a
}
.word-chip:nth-of-type(4) {
  background:#efdfca;
  border-color:#ddc6a6;
  color:#8a602f
}
.word-chip:hover {
  filter:brightness(.96)
}
.word-chip .icon {
  width:13px;
  height:13px
}

.rank-heading {
  display:flex;
  align-items:center;
  gap:13px;
  margin:4px 0 20px
}
.rank-heading h3 {
  flex:1;
  margin:0;
  font-size:18px
}
.rank-number {
  display:grid;
  place-items:center;
  width:36px;
  height:38px;
  background:#dcd2ef;
  color:#674bb2;
  border-radius:10px;
  font-size:16px;
  font-weight:650;
  flex:none
}
.rank-controls {
  display:flex;
  gap:4px
}
fieldset {
  border:1px solid #c5d1e2;
  border-radius:11px;
  padding:13px 17px;
  margin:18px 0 22px;
  min-width:0
}
legend {
  font-size:12px;
  color:#5a6e8d;
  padding:0 6px
}
.analysis-extra {
  padding:0 20px 17px;
  border:1px solid #bbcde0;
  border-radius:13px;
  background:#dce7f0
}
.analysis-extra:not([open]) {
  padding-bottom:0
}
.analysis-extra>summary {
  padding:16px 0;
  font-size:13px;
  font-weight:600;
  color:#4e6583;
  cursor:pointer
}
.analysis-extra>summary span {
  float:right;
  background:#c7d7e9;
  border-radius:5px;
  padding:0 7px;
  font-size:12px
}
.analysis-extra>.entry-card {
  margin-top:15px
}
.analysis-extra .section-heading {
  margin:5px 0 13px
}
.hint {
  color:#607491;
  font-size:12px;
  line-height:1.85
}

.review-prompts {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:12px 0
}
.review-prompt {
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  background:#edf3fa;
  color:#4f698b;
  border:1px solid #cad7e8;
  border-radius:9px;
  padding:14px;
  font-size:12px
}
.review-prompt span {
  flex:1
}
.review-prompt .icon {
  width:15px
}
.review-card {
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:18px;
  border-left:4px solid #9381c2;
  padding:21px 25px
}
.review-card h3 {
  font-size:15px;
  line-height:1.75
}
.review-actions {
  display:flex;
  align-items:center;
  gap:12px
}
.review-actions select {
  width:auto;
  padding:8px 10px;
  font-size:12px
}

.step-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding-top:22px;
  margin-top:27px;
  border-top:1px solid #bac9dd
}
.step-footer .button {
  font-size:14px;
  padding:11px 17px
}
.review-toggle {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#576f90;
  padding:10px;
  border-radius:9px
}
.review-toggle:hover {
  background:#d0ddf0
}
.review-toggle .icon {
  width:15px;
  height:15px
}
.review-toggle.is-reviewed {
  background:#cee5dc;
  color:#276f5c
}

/* A reading room: compact index on the left, working source on the right. */
.library-dialog {
  width:min(1360px,calc(100% - 32px));
  height:94dvh;
  max-height:94dvh;
  border:1px solid #bccdcd;
  background:#f4f6f3;
  overflow:hidden;
  border-radius:22px;
  color:#233b3c
}
.library-dialog #modal-content {padding:0;height:100%;}
.library-shell {height:100%;display:flex;flex-direction:column;min-width:0;}
.library-header {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:#173b40;color:#f6fbf7;flex-shrink:0;}
.library-brand {display:flex;align-items:center;gap:14px;min-width:0;}
.library-brand>.icon {width:43px;height:43px;padding:10px;border:1px solid #ffffff27;border-radius:13px;color:#dcea9d;background:#ffffff09;}
.library-brand h2 {font-size:23px;letter-spacing:-.5px;}
.library-brand p {font-size:12px;color:#bcceca;margin-top:3px;}
.library-header-actions {display:flex;gap:12px;align-items:center;flex-shrink:0;}
.library-header-actions .icon-button {color:#d9e5df;}
.library-header .language-switch {background:#ffffff0c;border-color:#ffffff2c;}
.library-header .language-switch button {color:#ccdeda;}
.library-header .language-switch button.selected {color:#173b40;background:#deeca7;}
.library-tabs {display:flex;gap:6px;padding:0 27px;flex-shrink:0;background:#e8eeea;border-bottom:1px solid #cbd8d0;overflow:auto;}
.library-tabs button {display:flex;align-items:center;gap:8px;flex-shrink:0;padding:15px 12px 13px;font-size:13px;color:#647b74;border-bottom:3px solid transparent;}
.library-tabs button span {font-size:10px;background:#d8e2dc;border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums;}
.library-tabs button.selected {color:#185b54;border-color:#23796c;font-weight:700;}
.library-tabs button.selected span {background:#2e7665;color:#fff;}
.library-body {display:grid;grid-template-columns:43% minmax(0,1fr);flex:1;min-height:0;overflow:hidden;}
.library-browser {display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid #cedbd1;background:#eaf0eb;}
.library-controls {padding:19px 19px 0;flex-shrink:0;}
.library-search {display:flex;align-items:center;gap:9px;background:#f9fcf8;border:1px solid #becfc4;border-radius:11px;padding:9px 12px;}
.library-search:focus-within {outline:2px solid #308573;outline-offset:2px;}
.library-search .icon {color:#658575;width:18px;flex-shrink:0;}
.library-search input {padding:0;border:0;background:transparent;min-width:0;width:100%;font-size:13px;outline:none;}
.library-search input::placeholder {color:#7f9486;}
.library-filter-chips {display:flex;flex-wrap:wrap;gap:5px;margin:13px 0 10px;}
.library-filter-chips button {border:1px solid transparent;color:#5d766c;padding:4px 8px;border-radius:6px;font-size:11px;line-height:1.6;}
.library-filter-chips button:hover {background:#dce6de;}
.library-filter-chips button.selected {background:#cbded2;border-color:#aecab8;color:#1c604f;font-weight:650;}
.library-filter-row {display:flex;align-items:center;gap:10px;}
.library-filter-row select {min-width:0;flex:1;border:1px solid #c6d5cb;border-radius:7px;background:#f5f8f3;padding:6px 9px;font-size:11px;}
.library-linked-filter {display:flex;gap:5px;align-items:center;flex-shrink:0;font-size:11px;color:#5d766c;}
.library-linked-filter input {accent-color:#276b5b;}
.library-result-summary {display:flex;align-items:center;justify-content:space-between;gap:5px;padding:12px 0 7px;font-size:11px;color:#73877e;}
.library-text-button {font-size:11px;padding:0;color:#317660;min-height:24px;}
.library-text-button .icon {width:13px;height:13px;}
.library-results {padding:5px 11px 14px;overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:#adbdaf transparent;}
.library-row {display:block;width:100%;text-align:left;padding:10px 13px;margin-bottom:5px;border:1px solid #dae4da;border-radius:9px;color:#334e42;background:#f5f8f3;transition:background .15s,border-color .15s;}
.library-row:hover {background:#e0eadf;border-color:#c9d8c9;}
.library-row.active {background:#d8e8d9;border-color:#90b59a;box-shadow:inset 3px 0 #347c60;}
.library-row-top,.library-row-bottom {display:flex;align-items:center;justify-content:space-between;gap:8px;}
.library-row-kind {font-size:10px;font-weight:650;color:#75887a;}
.library-use-badge {display:inline-flex;gap:3px;align-items:center;color:#2d6c50;font-size:10px;flex-shrink:0;}
.library-use-badge .icon {width:11px;height:11px;}
.library-review-badge {font-size:9px;color:#947443;background:#f0e5c8;border-radius:4px;padding:1px 5px;white-space:nowrap;}
.library-row-title {display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;line-height:1.7;font-weight:550;margin:4px 0 2px;}
.library-row-bottom {display:none;font-size:10px;color:#7f9082;}
.library-row-bottom>span:last-child {display:none;}
.library-pagination {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 18px;border-top:1px solid #c7d7c9;background:#e1eade;flex-shrink:0;}
.library-pagination>span {font-size:11px;color:#6c856d;font-variant-numeric:tabular-nums;}
.library-pagination .icon-button {width:30px;height:30px;color:#43775e;border:1px solid #c3d4c2;background:#f2f6ed;border-radius:7px;}
.library-mobile-bar {display:none;}
.library-row-bottom>span:first-child {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.library-row-bottom>span:last-child {font-size:15px;color:#658975;}
.library-browser-bottom {padding:11px 18px;background:#e0e9e1;border-top:1px solid #ccd8ce;}
.library-browser-bottom .button {font-size:12px;color:#2f6757;padding:7px 0;}
.library-reading {overflow:auto;min-height:0;background:#f7f8f2;scrollbar-width:thin;scrollbar-color:#bfcac0 transparent;}
.library-detail-inner {padding:28px 33px 34px;}
.library-detail-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px;}
.library-detail-kicker {font-size:11px;letter-spacing:.4px;color:#54806a;border-radius:5px;background:#e5edde;padding:4px 9px;}
.library-detail-heading .record-id {font-size:10px;color:#98a392;}
.library-reading-text {font-size:18px;font-weight:550;line-height:1.95;letter-spacing:-.15px;}
.library-reading-title {font-size:26px;line-height:1.55;letter-spacing:-.4px;}
.library-reading-note {font-size:11px;color:#819184;line-height:1.8;margin-top:13px;}
.library-relevance {padding:20px 22px;margin:24px 0;background:#e6efea;border:1px solid #c6d9cc;border-radius:13px;}
.library-section-title {display:flex;gap:8px;align-items:center;margin-bottom:16px;}
.library-section-title .icon {width:17px;height:17px;color:#39735b;}
.library-section-title h3 {font-size:14px;font-weight:650;}
.library-relevance>p {font-size:13px;color:#597663;margin-bottom:14px;}
.library-relevance .field {margin-bottom:14px;}
.library-relevance .field>span {font-size:11px;color:#6a8171;margin-bottom:6px;}
.library-relevance .field select,.library-relevance .field textarea {background:#f6f9f2;border-color:#bfd0c1;border-radius:8px;font-size:12px;line-height:1.8;padding:10px 12px;}
.library-relevance .field textarea {min-height:88px;}
.library-relevance .field textarea::placeholder {font-size:12px;color:#8c9a8e;}
.library-relevance .button.primary,.library-dialog .button.primary {background:#276859;color:#f6faf3;border-color:#276859;box-shadow:0 3px 8px #1f594716;}
.library-save-row {display:flex;align-items:center;justify-content:space-between;gap:12px;}
.library-save-row small {color:#6c8776;font-size:10px;}
.library-relations {display:flex;flex-direction:column;gap:8px;}
.library-relations:empty {display:none;}
.library-relations article {display:flex;align-items:flex-start;gap:9px;border-top:1px solid #cadacc;padding-top:14px;margin-top:15px;font-size:12px;}
.library-relations article>div {flex:1;min-width:0;}
.library-relations strong {font-weight:600;color:#486957;}
.library-relations p {margin-top:4px;color:#6b8272;white-space:pre-wrap;}
.library-relations .icon-button {width:25px;height:25px;flex-shrink:0;}
.library-provenance {padding:4px 0;margin-top:22px;}
.library-source-title {font-size:12px;font-weight:650;line-height:1.8;color:#5b7363;}
.library-locator {display:flex;gap:9px;flex-wrap:wrap;padding:11px 0;font-size:11px;color:#879286;}
.library-locator strong {font-weight:550;color:#4f6a57;}
.library-original {margin:16px 0;padding:17px 20px;border-left:3px solid #b2c39b;background:#edf0e1;border-radius:0 9px 9px 0;}
.library-original>span {display:block;font-size:10px;letter-spacing:.4px;color:#919879;margin-bottom:9px;}
.library-original p {font-size:12px;color:#607057;line-height:1.9;white-space:pre-wrap;}
.library-confidence {display:block;font-size:10px;color:#7e8e80;margin:10px 0;}
.library-provenance .source-review {display:block;padding:12px 14px;border-radius:8px;line-height:1.9;font-size:11px;background:#e7eee0;color:#597255;white-space:pre-wrap;}
.library-provenance .source-review.pending {color:#88662e;background:#f4ecd7;border:1px solid #e9d9af;}
.library-provenance .source-note {font-size:11px;color:#7c8b79;margin:12px 0;}
.library-source-link {display:inline-flex;color:#347263;font-size:12px;margin-top:15px;border-bottom:1px solid #a7c1ad;padding-bottom:3px;}
.library-footer {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 26px;background:#e3eade;border-top:1px solid #cbd7c8;flex-shrink:0;}
.library-footer p {display:flex;align-items:center;gap:7px;font-size:11px;color:#74816b;}
.library-footer p .icon {width:15px;height:15px;color:#63876b;}
.library-footer .button {font-size:12px;flex-shrink:0;}
.library-no-results,.library-welcome {padding:45px 22px;text-align:center;color:#7d9281;}
.library-no-results>.icon,.library-welcome>.icon {width:37px;height:37px;color:#9aac91;margin-bottom:16px;}
.library-no-results h3,.library-welcome h3 {font-size:15px;margin-bottom:9px;color:#638069;}
.library-no-results p,.library-welcome p {font-size:12px;line-height:1.9;margin-bottom:15px;}
.library-principle-desc {font-size:16px;line-height:1.9;color:#59705f;margin:16px 0;}
.library-principle-action {margin-top:26px;}
.library-principle-action p {font-size:12px;color:#7f8b7b;margin-top:12px;}
.library-event-date {display:block;font-size:26px;color:#548272;margin:5px 0 13px;letter-spacing:-.5px;}
.library-publisher {font-size:13px;color:#7b8d7d;margin-top:15px;}
.library-source-caution {background:#f0ead9;color:#8a7853;font-size:13px;line-height:1.9;padding:19px 22px;border-radius:11px;margin:23px 0 8px;}
.library-source-usage {display:flex;align-items:center;gap:20px;margin:30px 0;padding:20px 0;border-top:1px solid #d8dece;border-bottom:1px solid #d8dece;}
.library-source-usage>strong {font-size:43px;line-height:1.2;color:#4b7e5f;font-weight:550;}
.library-source-usage h3 {font-size:14px;color:#4a6a57;}
.library-source-usage p {font-size:12px;color:#899782;margin-top:5px;}
.library-word-preview {display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0 13px;}
.library-word-preview span {padding:27px 19px;border:1px dashed #cbd4bd;border-radius:11px;color:#829377;font-size:12px;background:#edf0e2;}
.basis-search {margin-bottom:15px;}
.basis-options {max-height:300px;overflow:auto;padding:2px 10px 2px 0;scrollbar-width:thin;}

/* Dialogs and materials */
dialog {
  width:min(580px,calc(100% - 32px));
  max-height:88vh;
  border:1px solid #b9cce5;
  border-radius:20px;
  padding:0;
  background:#edf2fa;
  color:var(--ink);
  box-shadow:0 24px 100px #12294345
}
dialog::backdrop {
  background:#11274480;
  backdrop-filter:blur(5px)
}
#modal-content {
  padding:28px
}
.modal-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:24px;
  padding-bottom:17px;
  border-bottom:1px solid #c5d2e6
}
.modal-head h2 {
  font-size:22px;
  letter-spacing:-.5px
}
.modal-actions {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  margin-top:24px
}
.modal-message {
  color:#4f6785;
  font-size:14px;
  line-height:1.9
}

.drawer {
  position:fixed;
  inset:0 0 0 auto;
  width:min(610px,100%);
  height:100dvh;
  max-height:100dvh;
  margin:0;
  border-radius:22px 0 0 22px;
  border-width:0 0 0 1px;
  background:#e5edf7
}
.drawer #modal-content {
  padding:27px
}
.drawer .modal-head {
  margin-bottom:20px
}
.material-purpose {
  position:relative;
  background:linear-gradient(120deg,#1c3d60,#2e6471);
  color:white;
  border:1px solid #ffffff30;
  border-radius:15px;
  padding:21px 22px;
  margin-bottom:21px;
  overflow:hidden
}
.material-purpose h3 {
  font-size:21px;
  max-width:420px;
  letter-spacing:-.4px
}
.material-purpose p {
  color:#d9e8ef;
  font-size:12px;
  margin:8px 0 15px;
  max-width:405px
}
.material-purpose>div {
  color:#e4edbe;
  font-size:11px;
  letter-spacing:.4px;
  border-top:1px solid #ffffff25;
  padding-top:13px
}
.purpose-icon {
  position:absolute;
  right:15px;
  top:16px;
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border:1px solid #ffffff25;
  color:#d9eaaa;
  background:#ffffff0b;
  border-radius:12px;
  transform:rotate(-10deg)
}
.purpose-icon .icon {
  width:20px
}

.drawer-tabs {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:5px;
  background:#d2dff0;
  border:1px solid #b8cbe3;
  border-radius:12px;
  margin-bottom:18px
}
.drawer-tabs button {
  flex:1;
  padding:8px 7px;
  font-size:12px;
  white-space:nowrap;
  border-radius:8px;
  color:#4e6787
}
.drawer-tabs button.selected {
  background:#214264;
  color:white;
  box-shadow:0 3px 6px #193c651a
}
.drawer .hint {
  margin-bottom:15px
}
.fact-filters {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:17px 0
}
.fact-filters button {
  display:flex;
  align-items:center;
  gap:6px;
  background:#d9e4f0;
  border:1px solid #bacde1;
  color:#4a6885;
  font-size:11px;
  border-radius:8px;
  padding:6px 9px
}

  border-color:#90b8a8;

}

}

.library-card {

.source-details>summary:after {

.principle-group {

  border-radius:12px;
  background:#d7e4f0;
  padding:0 15px
}

}
.case-list {
  display:grid;
  gap:9px;
  max-height:265px;
  overflow-y:auto
}
.case-option {

}

  color:#5b7aa5
}

  background:#d6e3fc;
  color:#2d54b8
}

}

}

}

.tools-list {
  display:grid;
  gap:8px
}
.tools-list .button {
  justify-content:flex-start;
  background:#e0e9f6;
  border-color:#c9d6e8;

}

}

  margin:20px 0
}

  font-size:12px
}

}

}
.reminders>p {

  color:#5c7596;
  padding:13px 15px
}
.quote {
  border-left:3px solid #438a99;
  border-radius:0 9px 9px 0;
  background:#dce9ed;
  padding:17px 20px;
  font-size:14px;
  color:#3e6274;
  margin-bottom:23px
}
.export-choices,.help-actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px
}

.timeline {
  padding-left:22px;
  border-left:2px solid #91b0c9;
  margin-left:8px
}
.timeline article {
  position:relative;
  background:#edf3f9;
  border:1px solid #c4d3e4;
  border-radius:12px;
  padding:17px;
  margin-bottom:15px
}
.timeline article:before {
  content:'';
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#377991;
  border:2px solid #e5edf7;
  left:-28px;
  top:22px
}
.timeline time {
  font-size:12px;
  color:#487996;
  font-weight:600
}
.timeline h3 {
  font-size:14px;
  line-height:1.8;
  margin:8px 0
}

#toast {
  position:fixed;
  bottom:28px;
  left:calc(50% + 135px);
  transform:translate(-50%,8px);
  padding:13px 22px;
  background:#203d5e;
  color:#f2f6ff;
  border:1px solid #ffffff20;
  border-radius:11px;
  box-shadow:0 10px 30px #142c4433;
  z-index:100;
  opacity:0;
  pointer-events:none;
  font-size:13px;
  transition:opacity .2s,transform .2s;
  max-width:90vw
}
#toast.visible {
  opacity:1;
  transform:translate(-50%,0)
}
.sr-only {
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  margin:-1px!important;
  padding:0!important;
  border:0!important
}

(function (root) {

  function pad(num, width) {
    var s = String(num);
    while (s.length < width) {
      s = "0" + s;
    }
    return s;
  }

  function createIdGenerator(initialSeq) {
    var seq = initialSeq
      ? JSON.parse(JSON.stringify(initialSeq))
      : {};

    function next(prefix, step) {
      if (!seq[prefix]) {
        seq[prefix] = 0;
      }
      seq[prefix] += 1;
      if (prefix === "REL" || prefix === "SN") {
        return prefix + "-" + pad(seq[prefix], 4);
      }
      if (prefix === "CF") {
        var st = step != null ? step : 6;
        return prefix + "-" + st + "-" + pad(seq[prefix], 2);
      }
      var stepNum = step != null ? step : 1;
      return prefix + "-" + stepNum + "-" + pad(seq[prefix], 2);
    }

    function getSeq() {
      return JSON.parse(JSON.stringify(seq));
    }

    function loadSeq(nextSeq) {
      seq = JSON.parse(JSON.stringify(nextSeq));
    }

    return { next: next, getSeq: getSeq, loadSeq: loadSeq };
  }

  /** 从已有状态条目推断各前缀计数器下限（只增不减） */
  function seedSeqFromState(state) {
    var seq = {};
    var items = state.items || {};
    var key;
    for (key in items) {
      if (!Object.prototype.hasOwnProperty.call(items, key)) continue;
      bumpFromId(seq, items[key].id);
    }
    var rels = state.relations || [];
    var i;
    for (i = 0; i < rels.length; i++) {
      bumpFromId(seq, rels[i].id);
    }
    var snaps = state.snapshots || [];
    for (i = 0; i < snaps.length; i++) {
      bumpFromId(seq, snaps[i].id);
    }
    var conflicts = state.conflicts || [];
    for (i = 0; i < conflicts.length; i++) {
      bumpFromId(seq, conflicts[i].id);
    }
    return seq;
  }

  function bumpFromId(seq, id) {
    if (!id || typeof id !== "string") return;
    var parts = id.split("-");
    if (parts.length < 2) return;
    var prefix = parts[0];
    var numPart = parts[parts.length - 1];
    var n = parseInt(numPart, 10);

    if (!seq[prefix] || seq[prefix] < n) {

(function (root) {
  root.AppLogic = root.AppLogic || {};

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function createStorage(options) {
    options = options || {};
    var key = options.key || "engr4960j.fukushima.v2";
    var debounceMs = options.debounceMs != null ? options.debounceMs : 1000;
    var intervalMs = options.intervalMs != null ? options.intervalMs : 30000;

    var available = false;
    var storage = null;
    try {
      if (typeof localStorage !== "undefined") {
        var probe = "__engr4960j_probe__";
        localStorage.setItem(probe, "1");
        localStorage.removeItem(probe);
        storage = localStorage;
        available = true;
      }
    } catch (e) {
      available = false;
    }

    var pending = null;
    var debounceTimer = null;
    var intervalTimer = null;
    var lastPayload = null;

    function load() {
      if (!available || !storage) return { ok: false, reason: "storage_unavailable" };
      try {
        var raw = storage.getItem(key);
        if (!raw) return { ok: true, data: null };
        return { ok: true, data: JSON.parse(raw) };
      } catch (err) {
        return { ok: false, reason: "parse_error", error: String(err) };
      }
    }

    function saveNow(data) {
      if (!available || !storage) return { ok: false, reason: "storage_unavailable" };
      try {
        storage.setItem(key, JSON.stringify(data));
        lastPayload = clone(data);
        return { ok: true };
      } catch (err) {
        return { ok: false, reason: "write_error", error: String(err) };
      }
    }

    function scheduleSave(data) {
      lastPayload = clone(data);
      if (!available) return;
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () {
        saveNow(lastPayload);
      }, debounceMs);
    }

    function flushSave() {
      if (lastPayload) return saveNow(lastPayload);
      return { ok: true };
    }

    function startInterval(getDataFn) {
      if (!available || intervalTimer) return;
      intervalTimer = setInterval(function () {
        if (typeof getDataFn === "function") {
          scheduleSave(getDataFn());
        }
      }, intervalMs);
    }

      if (intervalTimer) {
        clearInterval(intervalTimer);
        intervalTimer = null;

        message: out.message,
        anchors: [toAnchor(out)]

      else suggestions.push(entry);
      anchors.push(toAnchor(out));
    }

    if (stepId === 4) {
      ctx.itemIds = [];
      for (var k in state.items) {
        if (state.items[k].type === "A") ctx.itemIds.push(k);

      if (basisOut) {
        suggestions.push({
          checkId: "requireBasis",
          level: "suggest",
          message: basisOut.message,
          anchors: [toAnchor(basisOut)]

        anchors.push(toAnchor(basisOut));

          level: "suggest",
          message: whyOut.message,

        anchors.push(toAnchor(whyOut));

/**
 * 状态树、dispatch、subscribe、快照

(function (root) {
  root.AppLogic = root.AppLogic || {};

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function emptyState() {
    return {

      caseId: "fukushima",
      currentStep: 1,
      startedAt: nowIso(),
      updatedAt: nowIso(),
      authorship: { notes: [], reservations: [] },
      stepStatus: {},

  function createStore(deps) {
    deps = deps || {};
    var idGen = deps.idGen;
    var storage = deps.storage;
    var listeners = [];
    var state = emptyState();

    function notify() {
      var snapshot = getState();
      var i;

        caseId: state.caseId,
        currentStep: state.currentStep,
        startedAt: state.startedAt,
        updatedAt: state.updatedAt,
        authorship: state.authorship,
        stepStatus: state.stepStatus,
        items: state.items,
        relations: state.relations,
        conflicts: state.conflicts,
        snapshots: state.snapshots,
        hasAcceptedL3: state.hasAcceptedL3,

      var i;
      for (i = 0; i < state.relations.length; i++) {
        var r = state.relations[i];
        if (r.from === id || r.to === id) impact.relations.push(r.id);
      }
      var key;
      for (key in state.items) {
        var it = state.items[key];
        if (it.basisRefs && it.basisRefs.indexOf(id) >= 0) impact.items.push(key);
        if (it.appliesTo && it.appliesTo.indexOf(id) >= 0) impact.items.push(key);
      }
      for (i = 0; i < state.conflicts.length; i++) {
        var c = state.conflicts[i];
        if (c.questionId === id) impact.conflicts.push(c.id);
      }
      return impact;
    }

    function markDependentsStale(changedId, reason) {
      var impact = findReferences(changedId);
      var i;
      for (i = 0; i < impact.items.length; i++) {
        var kid = impact.items[i];
        if (state.items[kid]) {
          state.items[kid].needsReview = true;
          state.items[kid].staleReason = reason || "dependency_changed";

      }
      var stepKeys = Object.keys(state.stepStatus || {});

    function loadState(payload, options) {

      if (payload.stateVersion !== "2.0") {

      }
      if (payload.caseId !== "fukushima") {
        return { ok: false, reason: "case_mismatch" };
      }
      if (options.replace !== true) {
        return { ok: false, reason: "use_replace_flag" };

      state = clone(payload);
      if (!state.idSeq) state.idSeq = root.AppLogic.seedSeqFromState(state);

    function dispatch(action) {

        case "ITEM_UPDATE": {

          for (fk in patch) {

            markDependentsStale(uid, "basis_changed");

          touch();
          break;
        }
        case "ITEM_SET_FIELD": {
          var fid = p.id;
          if (!fid || !state.items[fid]) return { ok: false, reason: "not_found" };

          state.items[fid].updatedAt = nowIso();

          break;
        }
        case "ITEM_DELETE": {
          var delId = p.id;

          var imp = findReferences(delId);

          if (hasRef && !p.force) {

          if (p.force) {

              return r.from !== delId && r.to !== delId;

          touch();

        case "STEP_STATUS_SET": {

          touch();

        case "RELATION_ADD": {
          var relId = idGen.next("REL");
          var rel = clone(p.relation || {});
          rel.id = relId;
          if (!rel.createdAt) rel.createdAt = nowIso();
          state.relations.push(rel);

          touch();
          result.id = relId;
          break;
        }
        case "RELATION_DELETE": {
          var rid = p.id;

          touch();
          break;

          var cf = clone(p.conflict || {});
          if (!cf.id) {
            cf.id = idGen.next("CF", p.step || 6);

          var found = false;
          var ci;
          for (ci = 0; ci < state.conflicts.length; ci++) {
            if (state.conflicts[ci].id === cf.id) {
              state.conflicts[ci] = cf;
              found = true;
              break;
            }
          }
          if (!found) state.conflicts.push(cf);
          state.idSeq = idGen.getSeq();
          touch();
          result.id = cf.id;
          break;
        }
        case "SNAPSHOT_CREATE": {
          var sid = createSnapshotInternal(p.label || "快照");
          result.id = sid;
          break;
        }
        case "SNAPSHOT_RESTORE": {
          var rr = restoreSnapshotInternal(p.id);
          return rr;
        }
        case "L3_ACCEPT": {
          state.hasAcceptedL3[String(p.step)] = true;
          touch();
          break;
        }
        default:
          return { ok: false, reason: "unknown_action" };
      }
      return result;
    }

    function createSnapshotInternal(label) {
      var sid = idGen.next("SN");
      var payload = {
        items: clone(state.items),
        relations: clone(state.relations),
        conflicts: clone(state.conflicts),
        stepStatus: clone(state.stepStatus),
        hasAcceptedL3: clone(state.hasAcceptedL3),
        idSeq: clone(state.idSeq)
      };
      state.snapshots.push({
        id: sid,
        label: label,
        createdAt: nowIso(),
        payload: payload
      });
      state.idSeq = idGen.getSeq();
      touch();
      return sid;
    }

    function restoreSnapshotInternal(sid) {
      var i;
      var snap = null;
      for (i = 0; i < state.snapshots.length; i++) {
        if (state.snapshots[i].id === sid) {
          snap = state.snapshots[i];
          break;
        }
      }
      if (!snap) return { ok: false, reason: "snapshot_not_found" };
      var pl = snap.payload;
      state.items = clone(pl.items);
      state.relations = clone(pl.relations);
      state.conflicts = clone(pl.conflicts || []);
      state.stepStatus = clone(pl.stepStatus || {});
      state.hasAcceptedL3 = clone(pl.hasAcceptedL3 || {});
      state.idSeq = clone(pl.idSeq || {});
      idGen.loadSeq(state.idSeq);
      touch();
      return { ok: true };
    }

    function createSnapshot(label) {
      return createSnapshotInternal(label);
    }

    function restoreSnapshot(id) {
      return restoreSnapshotInternal(id);
    }

    return {
      getState: getState,
      dispatch: dispatch,
      subscribe: subscribe,
      createSnapshot: createSnapshot,
      restoreSnapshot: restoreSnapshot,
      getPersistPayload: getPersistPayload
    };
  }

  root.AppLogic.createStore = createStore;
})(typeof window !== "undefined" ? window : globalThis);

          });
          break;
        case "UNLINK":
          store.dispatch({ type: "RELATION_DELETE", payload: { id: p.id } });
          break;
        case "ADD_CONFLICT":
          store.dispatch({
            type: "CONFLICT_UPSERT",
            payload: { step: 6, conflict: clone(p) }
          });
          break;
        case "UPDATE_CONFLICT":
          store.dispatch({
            type: "CONFLICT_UPSERT",
            payload: {
              step: 6,
              conflict: Object.assign({ id: p.id }, clone(p.fields || {}))
            }
          });
          break;
        case "DELETE_CONFLICT": {
          var filtered = clone(getState());
          filtered.conflicts = filtered.conflicts.filter(function (c) {
            return c.id !== p.id;
          });
          loadState(store, filtered);
          break;
        }
        case "ADD_NOTE": {
          var withNote = clone(getState());
          var bucket = p.kind === "reservation" ? "reservations" : "notes";
          withNote.authorship[bucket].push(p.text);
          loadState(store, withNote);
          break;
        }
        case "ACCEPT_L3":
          store.dispatch({ type: "L3_ACCEPT", payload: { step: p.step } });
          break;
        case "SET_BASIS": {
          store.dispatch({
            type: "ITEM_UPDATE",
            payload: { id: p.id, patch: { basisRefs: p.refs || [] } }
          });
          if (p.gap) {
            store.dispatch({
              type: "RELATION_ADD",
              payload: {
                relation: {
                  from: p.id,
                  to: p.gap,
                  kind: "assumption-fills-gap",
                  why: p.why || ""
                }
              }
            });
          }
          store.dispatch({
            type: "STEP_STATUS_SET",
            payload: { step: 4, status: "draft" }
          });
          break;
        }
        case "ANSWER": {
          var existing = getState().relations.find(function (rel) {
            return rel.kind === "resolution-answers-question" && rel.to === p.question;
          });
          if (!existing) {
            var addR = store.dispatch({
              type: "ITEM_ADD",
              payload: {
                prefix: "R",
                step: 8,
                item: { type: "R", step: 8, text: "" }
              }
            });
            if (addR && addR.ok) {
              store.dispatch({
                type: "RELATION_ADD",
                payload: {
                  relation: {
                    from: addR.id,
                    to: p.question,
                    kind: "resolution-answers-question",
                    why: ""
                  }
                }
              });
            }
          }
          break;
        }
        case "RESET":
          store.dispatch({ type: "STATE_RESET", payload: {} });
          break;
        default:
          warnOnce("dispatch-" + type, "未映射的 UI action: " + type);
      }
      touchSaving();
      return getState();
    }

    return {
      getState: getState,
      dispatch: uiDispatch,
      validateStep: function (step) {
        return logicInstance.validateStep(step);
      },
      subscribe: function (listener) {
        return store.subscribe(listener);
      },
      exportProject: function () {
        return JSON.stringify(getState(), null, 2);
      },
      importProject: function (json) {
        var input;
        try {
          input = typeof json === "string" ? JSON.parse(json) : clone(json);
        } catch (e) {
          return { ok: false, errors: ["json"] };
        }
        if (!input || input.stateVersion !== "2.0") {
          return { ok: false, errors: ["version"] };
        }
        var lr = loadState(store, input);
        if (!lr.ok) return { ok: false, errors: [lr.reason || "load"] };
        return { ok: true, state: getState() };
      },
      createSnapshot: function (label) {
        var res = store.dispatch({
          type: "SNAPSHOT_CREATE",
          payload: { label: label || "snapshot" }
        });
        return (res && res.id) || null;
      },
      restoreSnapshot: function (id) {
        store.dispatch({ type: "SNAPSHOT_RESTORE", payload: { id: id } });
      },
      flush: function () {
        if (storage.flushSave) storage.flushSave();
        saving = storage.available ? "saved" : "memory";
      },
      getSaveStatus: function () {
        return saving;
      },
      affected: function (id) {
        return related(getState(), id);
      },
      recoveryData: function () {
        warnOnce("recoveryData", "recoveryData 无 AppLogic 实现，返回 null");
        return null;
      },
      storageKey: key,
      runtimeId: RUNTIME_ID,
      isAppLogicAdapter: true
    };
  }

  root.AppLogicRuntime = {
    RUNTIME_ID: RUNTIME_ID,
    available: logicReady,
    create: create
  };
})(typeof globalThis !== "undefined" ? globalThis : typeof window !== "undefined" ? window : this);

    while (packs[id]) id += '-1';
    pack.meta = { id: id, title: title.trim(), dataVersion: template.meta.dataVersion, builtAt: new Date().toISOString().slice(0, 10) };
    pack.facts = []; pack.timeline = [];
    if (pack.assessments) pack.assessments = [];
    pack.sources = template.sources.filter(function (source) { return pack.principles.some(function (p) { return p.sourceId === source.id; }); });
    // Case-specific interpretive references must not leak into a new case.
    pack.steps.forEach(function (step) { step.referenceLevel3 = null; });
    packs[id] = pack;
    select(id);
    return id;
  }
  function addFact(text, categories, sourceTitle, year, url) {
    if (active === template.meta.id) return false;
    if (!text.trim() || !sourceTitle.trim() || !categories.length || categories.some(function (c) { return !['material', 'individual', 'organization'].includes(c); }) || !Number.isInteger(year)) return false;
    var pack = packs[active], suffix = Date.now().toString(36);
    var sourceId = 'src-user-' + suffix;
    while (pack.sources.some(function (source) { return source.id === sourceId; })) sourceId += '-1';
    pack.sources.push({ id: sourceId, title: sourceTitle.trim(), publisher: '', year: year, url: url || '', accessedAt: new Date().toISOString().slice(0, 10) });
    pack.facts.push({ id: 'f-' + { material: 'mat', individual: 'ind', organization: 'org' }[categories[0]] + '-user-' + sourceId.slice(9), text: text.trim(), categories: categories, sourceId: sourceId, note: '' });
    metadataSaved = saveCatalog();
    // Rebuild static-reference validation without changing the author's analysis.
    var savedState = runtime.getState();
    if (runtime.flush) runtime.flush();
    runtime = createRuntime(pack, active, { state: savedState });
    return true;
  }
  function staticRefIds(pack) {
    var ids = new Set();
    pack.facts.forEach(function (f) { ids.add(f.id); });
    pack.sources.forEach(function (s) { ids.add(s.id); });
    pack.principles.forEach(function (p) { ids.add(p.id); });
    return ids;
  }
  function validateAnalysisPayload(payload, pack) {
    if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
      return { ok: false, code: 'structure', message: '存档结构无效：根对象缺失或类型错误。' };
    }

    }
    if (!payload.items || typeof payload.items !== 'object' || Array.isArray(payload.items)) {
      return { ok: false, code: 'structure', message: '存档结构无效：items 必须为对象。' };
    }
    if (!Array.isArray(payload.relations) || !Array.isArray(payload.conflicts) || !Array.isArray(payload.snapshots)) {
      return { ok: false, code: 'structure', message: '存档结构无效：relations / conflicts / snapshots 必须为数组。' };
    }

      return { ok: false, code: 'structure', message: '存档结构无效：stepStatus 或 idSeq 类型错误。' };

    Object.keys(payload.items).forEach(function (id) { ids.add(id); });

    for (ri = 0; ri < payload.relations.length; ri++) {
      var rel = payload.relations[ri];
      if (!rel || !ids.has(rel.from) || !ids.has(rel.to)) {
        return { ok: false, code: 'integrity', message: '关联完整性失败：relation ' + (rel && rel.id ? rel.id : ri) + ' 引用不存在的 id。' };
      }
    }
    var ci;
    for (ci = 0; ci < payload.conflicts.length; ci++) {
      var cf = payload.conflicts[ci];
      if (!cf || !ids.has(cf.questionId) || !ids.has(cf.principleA) || !ids.has(cf.principleB)) {
        return { ok: false, code: 'integrity', message: '关联完整性失败：conflict ' + (cf && cf.id ? cf.id : ci) + ' 引用不存在的 id。' };
      }
    }
    return { ok: true };
  }
  function exportProject() {
    if (active === template.meta.id) return runtime.exportProject();
    return JSON.stringify({ format: 'fieldnotes-project-v1', caseData: packs[active], state: runtime.getState() }, null, 2);
  }
  function importProject(json) {
    var input;
    try { input = typeof json === 'string' ? JSON.parse(json) : clone(json); } catch (error) { return { ok: false, code: 'json', message: '无法解析 JSON。' }; }
    var bundled = input && input.format === 'fieldnotes-project-v1';
    var pack = bundled ? input.caseData : input && Object.prototype.hasOwnProperty.call(packs, input.caseId) ? packs[input.caseId] : null;
    var payload = bundled ? input.state : input;

    var candidate = window.FrontendPreviewRuntime.create(pack, { persistent: false });
    var result = candidate.importProject(payload);
    candidate.flush();
    if (!result.ok) {
      if (pack.meta.id !== template.meta.id || !(window.AppLogicRuntime && window.AppLogicRuntime.available())) {
        return { ok: false, code: 'preview', message: '预览运行时拒绝该存档（结构或字段不兼容）。' };
      }
      if (runtime.flush) runtime.flush();
      packs[pack.meta.id] = pack;
      active = pack.meta.id;
      runtime = createRuntime(pack, active, { state: payload });
      metadataSaved = saveCatalog();
      return { ok: true, compatMode: !!(runtime && runtime.isPreview) };
    }
    if (runtime.flush) runtime.flush();
    packs[pack.meta.id] = pack;
    active = pack.meta.id;
    runtime = createRuntime(pack, active, { state: result.state || payload });
    metadataSaved = saveCatalog();
    return { ok: true, compatMode: !!(runtime && runtime.isPreview) };
  }
  window.FieldnotesCases = {
    getData: function () { return packs[active]; }, getRuntime: function () { return runtime; },
    list: function () { return Object.values(packs).map(function (pack) { return { id: pack.meta.id, title: pack.meta.title }; }); },
    select: select, create: create, addFact: addFact, importProject: importProject, exportProject: exportProject,
    validateAnalysisPayload: validateAnalysisPayload,
    isCustom: function () { return active !== template.meta.id; },
    getSaveStatus: function () { return metadataSaved ? (runtime.getSaveStatus ? runtime.getSaveStatus() : 'unknown') : 'memory'; },
    mount: function (instance) { if (runtime.flush) runtime.flush(); runtime = instance; },
    recoveryData: function () { return recovery; }
  };
})();

  <script>
/* An offline reading workspace. Selection and draft reasons are UI-only;

(function () {
  'use strict';
  function create(ctx) {

    function bi(zh,en){return ctx.locale()==='zh'?zh:en;}

    function data(){return ctx.data();}

    function button(label,action,cls,attrs){return '<button type="button" class="button '+(cls||'')+'" data-lib="'+action+'" '+(attrs||'')+'>'+label+'</button>';}
    function sourceOf(x){return data().sources.find(function(s){return s.id===x.sourceId;});}
    function relations(id){return state().relations.filter(function(r){return r.from===id&&r.kind==='fact-supports-question';});}
    function chosen(id){return items('PA').some(function(x){return x.principleId===id;});}
    function records(){
      if(tab==='facts')return ctx.facts();
      if(tab==='principles')return data().principles;
      if(tab==='sources')return data().sources;
      if(tab==='timeline')return data().timeline.filter(function(x){return !/TODO|占位|待补/.test(x.event);}).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});

    function name(x){
      var loc=ctx.locale();

      if(tab==='glossary'){var i=data().valueWords.indexOf(x);return ctx.locale()==='zh'?x.word:(ctx.words[i]||[x.word])[0];}

    function searchable(x){var s=sourceOf(x);return [name(x),x.text,x.name,x.nameEn,x.desc,x.event,x.date,x.quote,x.locator,x.note,x.id,x.publisher,x.year,mt(x,'note'),mt(x,'locator'),mt(x,'quote'),mt(x,'desc'),s&&mt(s,'title'),s&&mt(s,'publisher'),s&&s.title,s&&s.publisher].join(' ').toLocaleLowerCase();}
    function filtered(){var terms=query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);return records().filter(function(x){
      return terms.every(function(term){return searchable(x).includes(term);})&&

        (tab!=='principles'||category==='all'||x.group===category);

    function metadata(x){
      if(tab==='facts')return x.categories.map(function(c){return t(c);}).join(' · ');
      if(tab==='principles')return t(x.group);

      if(tab==='timeline')return mt(x,'date');
      return t('team');
    }
    function filters(){
      var html='';
      if(tab==='facts'||tab==='principles'){
        var cats=tab==='facts'?['all','material','individual','organization']:['all','basic','organization','employee','involvement','rights'];
        html='<div class="library-filter-chips" role="group" aria-label="'+e(t('filterFacts'))+'">'+cats.map(function(c){return '<button type="button" id="library-category-'+c+'" data-lib="category" data-category="'+c+'" aria-pressed="'+(category===c)+'" class="'+(category===c?'selected':'')+'">'+e(c==='all'?bi('全部','All'):t(c))+'</button>';}).join('')+'</div>';
      }

      return html;

    }
    function draft(x){
      if(!drafts[x.id]){var qs=items('Q'), existing=relations(x.id)[0];drafts[x.id]={target:existing?existing.to:qs.length===1?qs[0].id:'',why:existing?existing.why:'',dirty:false,reasons:{}};}
      var d=drafts[x.id];if(d.target&&!items('Q').some(function(q){return q.id===d.target;})){d.target='';d.why='';d.dirty=false;}return d;
    }
    function linkForm(x){
      if(ctx.readonly())return '';
      var qs=items('Q'), d=draft(x), existing=relations(x.id).find(function(r){return r.to===d.target;});
      return '<section class="library-relevance"><div class="library-section-title">'+ctx.icon('link')+'<h3>'+e(bi('它如何帮助你的分析？','How does it inform your analysis?'))+'</h3></div>'+
        (qs.length?'<form id="library-link-form" data-id="'+e(x.id)+'"><label class="field"><span>'+e(t('questionTarget'))+'</span><select id="library-target" name="target" required><option value="">'+e(t('choose'))+'</option>'+qs.map(function(q){return '<option value="'+e(q.id)+'" '+(d.target===q.id?'selected':'')+'>'+e(q.text||q.id)+'</option>';}).join('')+'</select></label><label class="field"><span>'+e(t('whyRelated'))+'</span><textarea id="library-why" name="why" rows="3" required placeholder="'+e(t('whyHint'))+'">'+e(d.why)+'</textarea></label><div class="library-save-row"><small id="library-draft-status" role="status">'+e(d.dirty?bi('未保存的引用理由','Unsaved reason'):existing?bi('已保存，可以修改理由','Saved. You can edit the reason.'):bi('由你决定是否引用','You decide whether to use it.'))+'</small><button type="submit" class="button primary small">'+ctx.icon(existing?'check':'plus')+e(existing?bi('更新引用','Update link'):bi('保存引用','Save link'))+'</button></div></form>':

        '<div class="library-relations">'+relations(x.id).map(function(r){var q=state().items[r.to];return '<article><div><strong>'+e(q?q.text||q.id:r.to)+'</strong><p>'+e(r.why)+'</p></div>'+button(ctx.icon('close'),'unlink','icon-button quiet','data-id="'+e(r.id)+'" aria-label="'+e(t('remove'))+'"')+'</article>';}).join('')+'</div></section>';

    function detail(x){

 * 修订对比：基于 snapshots 的纯函数差异与 HTML 渲染（不新增逻辑层接口）。

(function (root) {
  'use strict';

  var LABEL_INITIAL = '初步';
  var LABEL_REVIEWED = '复核后';

  function t(key, locale) {
    var pairs = root.FieldnotesI18n && root.FieldnotesI18n.pairs;
    if (!pairs || !pairs[key]) return key;
    return pairs[key][locale === 'en' ? 1 : 0];
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function payloadOf(snap) {
    return snap && snap.payload ? snap.payload : null;
  }

  function findSnapshotByLabel(state, label) {
    var list = (state && state.snapshots) || [];
    var i;
    for (i = list.length - 1; i >= 0; i--) {
      if (list[i].label === label) return list[i];
    }
    return null;
  }

  function fieldDiff(before, after, keys) {
    var parts = [];
    keys.forEach(function (key) {
      var a = before ? before[key] : undefined;
      var b = after ? after[key] : undefined;
      if (JSON.stringify(a) !== JSON.stringify(b)) {
        parts.push({ key: key, before: a, after: b });
      }
    });
    return parts;
  }

  function comparePayloads(left, right) {
    var result = { added: [], deleted: [], modified: [], relationAdded: [], relationDeleted: [], conflictAdded: [], conflictDeleted: [] };
    if (!left || !right) return result;
    var ids = new Set();
    Object.keys(left.items || {}).forEach(function (id) { ids.add(id); });
    Object.keys(right.items || {}).forEach(function (id) { ids.add(id); });
    ids.forEach(function (id) {
      var a = left.items[id];
      var b = right.items[id];
      if (a && !b) result.deleted.push({ id: id, before: a });
      else if (!a && b) result.added.push({ id: id, after: b });
      else if (a && b) {
        var fields = fieldDiff(a, b, ['text', 'basisRefs', 'categories', 'isCore', 'focusReason', 'reason', 'word', 'others', 'mine']);
        if (fields.length) result.modified.push({ id: id, before: a, after: b, fields: fields });
      }
    });
    var relIds = new Set();
    (left.relations || []).concat(right.relations || []).forEach(function (r) { relIds.add(r.id); });
    relIds.forEach(function (rid) {
      var l = (left.relations || []).find(function (x) { return x.id === rid; });
      var r = (right.relations || []).find(function (x) { return x.id === rid; });
      if (l && !r) result.relationDeleted.push(l);
      if (!l && r) result.relationAdded.push(r);
    });
    var cfIds = new Set();
    (left.conflicts || []).concat(right.conflicts || []).forEach(function (c) { cfIds.add(c.id); });
    cfIds.forEach(function (cid) {
      var l = (left.conflicts || []).find(function (x) { return x.id === cid; });
      var r = (right.conflicts || []).find(function (x) { return x.id === cid; });
      if (l && !r) result.conflictDeleted.push(l);
      if (!l && r) result.conflictAdded.push(r);
    });
    return result;
  }

  function summaryLine(diff, locale) {
    return t('revSummary', locale)
      .replace('{added}', String(diff.added.length))
      .replace('{modified}', String(diff.modified.length))
      .replace('{deleted}', String(diff.deleted.length));
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderPanel(state, locale) {
    locale = locale || 'zh';
    var leftSnap = findSnapshotByLabel(state, LABEL_INITIAL);
    var rightSnap = findSnapshotByLabel(state, LABEL_REVIEWED);
    if (!leftSnap || !rightSnap) {

        escapeHtml(t('revNeedBothSnapshots', locale)) +
        '</p></div>';
    }

    var html = '<div class="revision-compare" data-testid="revision-compare"><p class="revision-summary" data-testid="revision-summary">' +
      escapeHtml(summaryLine(diff, locale)) + '</p><div class="revision-columns">';
    html += '<section><h4>' + escapeHtml(t('initial', locale)) + '</h4><p><small>' + escapeHtml(leftSnap.createdAt || '') + '</small></p></section>';
    html += '<section><h4>' + escapeHtml(t('revised', locale)) + '</h4><p><small>' + escapeHtml(rightSnap.createdAt || '') + '</small></p></section></div>';
    html += '<ul class="revision-diff-list">';
    diff.added.forEach(function (row) {
      html += '<li><strong>' + escapeHtml(t('added', locale)) + '</strong> ' + escapeHtml(row.id) + ' — ' + escapeHtml(row.after.text || row.after.word || '') + '</li>';
    });
    diff.deleted.forEach(function (row) {
      html += '<li><strong>' + escapeHtml(t('deleted', locale)) + '</strong> ' + escapeHtml(row.id) + ' — ' + escapeHtml(row.before.text || row.before.word || '') + '</li>';
    });
    diff.modified.forEach(function (row) {
      html += '<li><strong>' + escapeHtml(t('modified', locale)) + '</strong> ' + escapeHtml(row.id);
      row.fields.forEach(function (f) {
        html += '<div class="revision-field"><span>' + escapeHtml(f.key) + '</span><del>' + escapeHtml(JSON.stringify(f.before)) + '</del><ins>' + escapeHtml(JSON.stringify(f.after)) + '</ins></div>';
      });
      html += '</li>';
    });
    diff.relationAdded.forEach(function (r) {
      html += '<li><strong>' + escapeHtml(t('revLinkAdded', locale)) + '</strong> ' + escapeHtml(r.from + ' → ' + r.to) + '</li>';
    });
    diff.relationDeleted.forEach(function (r) {
      html += '<li><strong>' + escapeHtml(t('revLinkRemoved', locale)) + '</strong> ' + escapeHtml(r.from + ' → ' + r.to) + '</li>';
    });
    html += '</ul></div>';
    return html;
  }

  root.RevisionCompare = {
    LABEL_INITIAL: LABEL_INITIAL,
    LABEL_REVIEWED: LABEL_REVIEWED,
    comparePayloads: comparePayloads,
    summaryLine: summaryLine,
    renderPanel: renderPanel,

          principleName(data, row.principleB) +

      .filter(function (rel) {
        return rel.kind === "resolution-answers-question" && rel.to === question.id;

      .map(function (rel) {

      group(mark ? "overview-group-assumptions" : "", copy("overviewAssumptions", "合理假设", "Reasonable assumptions"), assumptions, false) +
      group(mark ? "overview-group-concepts" : "", copy("overviewConcepts", "定义澄清", "Definitional clarification"), concepts, false) +
      group(mark ? "overview-group-principles" : "", copy("overviewPrinciples", "伦理分析", "Ethical analysis"), principles + conflicts, !full) +

    data = data || { facts: [], sources: [], principles: [] };

    var factLinks = (state.relations || []).filter(function (rel) {

    var summaryTpl = copy("overviewSummary", "核心问题 {core} 条 · 关联事实 {facts} 条 · 假设 {assumptions} 条 · 待澄清 {terms} 条", "Core questions {core} · linked facts {facts} · assumptions {assumptions} · terms {terms}");
    var summary = summaryTpl
      .replace("{core}", String(cores.length))
      .replace("{facts}", String(factLinks))
      .replace("{assumptions}", String(itemsOf(state, "A").length))
      .replace("{terms}", String(itemsOf(state, "C").length));
    var notice = cores.length

        esc(copy("overviewEmpty", "尚未选定核心问题。请先在第 2 步从伦理问题中选出 1–2 条作为分析焦点。", "No core question yet. In step 2, choose 1–2 ethical questions as the focus.")) +
        "</p>";

      ? heads
          .map(function (question, index) {
            return renderQuestion(state, data, question, index);
          })

      '<div id="reasoning-overview" class="revision-compare" data-readonly="true">' +

      "</button>" +
      '<button type="button" class="button small' +
      (scope === "full" ? " primary" : " quiet") +
      '" data-overview-scope="full">' +
      esc(copy("overviewFull", "完整视图", "Full view")) +
      "</button></div>" +
      notice +
      body +
      "</div>"
    );
  }

  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-overview-scope]");
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    scope = button.getAttribute("data-overview-scope") === "full" ? "full" : "class";
    var host = document.getElementById("reasoning-overview");
    if (!host) return;
    host.outerHTML = renderPanel(readState(), readData());
  });

  root.ReasoningOverview = {
    renderPanel: renderPanel,
    setReaders: function (stateFn, dataFn, localeFn) {
      if (stateFn) readState = stateFn;
      if (dataFn) readData = dataFn;
      if (localeFn) readLocale = localeFn;
    },
    getScope: function () {
      return scope;
