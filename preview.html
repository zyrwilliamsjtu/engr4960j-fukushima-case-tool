<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#355cf4">
  <title>Fieldnotes · 案例分析工作台</title>
  <style>
:root {
  --paper: #e4e9f6;
  --surface: #f2f4ff;
  --ink: #1d2b50;
  --muted: #77839b;
  --line: #cad5ed;
  --blue: #355cf4;
  --green: #355cf4;
  --soft: #edf1ff;
  --accent: #d9ed98;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; font-size: 14px; line-height: 1.65; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .38; cursor: default; }
a { color: var(--blue); text-decoration: none; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.45; font-weight: 650; }
p { overflow-wrap: anywhere; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid #88a1ff; outline-offset: 4px; }
input:focus, textarea:focus, select:focus { outline: 3px solid #dae3ff; border-color: #6284ff !important; }
.icon { width: 19px; height: 19px; flex: none; vertical-align: middle; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 11px 17px; border: 1px solid #dfe5f1; border-radius: 10px;
  background: white; font-size: 13px; font-weight: 600; line-height: 1.5;
  transition: background .16s, transform .16s, box-shadow .16s;
}
.button:hover:not(:disabled) { background: #f2f5ff; border-color: #c8d5fb; }
.button:active:not(:disabled) { transform: translateY(1px); }
.button.primary { background: var(--blue); color: white; border-color: var(--blue); box-shadow: 0 4px 12px #355cf422; }
.button.primary:hover:not(:disabled) { background: #244be0; box-shadow: 0 5px 16px #355cf438; }
.button.small { padding: 9px 14px; font-size: 12px; }
.button.quiet { border-color: transparent; background: transparent; color: #6c7994; box-shadow: none; }
.button.quiet:hover:not(:disabled) { background: #eaf0ff; color: var(--blue); }
.button.icon-button { width: 36px; height: 36px; padding: 8px; font-size: 0; gap: 0; }
.button.icon-button .icon { width: 17px; height: 17px; }
.skip-link { position: fixed; left: 20px; top: -80px; z-index: 200; background: var(--blue); color: white; padding: 12px 20px; border-radius: 8px; }
.skip-link:focus { top: 16px; }
/* One navigation column. One writing canvas. */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 270px; padding: 29px 18px 23px;
  background: linear-gradient(160deg, #1c2b58 0%, #14244b 65%, #192f54 100%); color: #e6edff; display: flex; flex-direction: column; z-index: 10;
}
.brand { display: flex; gap: 11px; align-items: center; color: white; padding: 0 11px; font-size: 25px; font-weight: 700; letter-spacing: -1px; line-height: 1.2; }
.brand-mark { width: 38px; height: 41px; display: grid; place-items: center; border-radius: 12px; background: #d9ed98; color: #14244b; }
.brand-mark .icon { width: 23px; height: 23px; }
.brand-sub { display: block; color: #8f9fbe; margin-top: 7px; font-size: 10px; letter-spacing: 1px; font-weight: 400; }
.nav-heading { color: #9aacce; font-size: 12px; letter-spacing: 1.5px; margin: 40px 15px 14px; }
.sidebar nav { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #35466e transparent; }
.step-nav { display: flex; align-items: center; width: 100%; padding: 12px 14px; gap: 12px; color: #c4cee4; text-align: left; border-radius: 10px; margin: 3px 0; transition: background .16s, color .16s; }
.step-nav:hover { background: #21345f; color: white; }
.step-nav.active { background: #355cf4; color: white; box-shadow: 0 5px 19px #030e3328; }
.step-index { width: 23px; flex: none; font-size: 13px; font-variant-numeric: tabular-nums; color: #99acd2; }
.active .step-index { color: #c5d3ff; }
.step-name { flex: 1; font-size: 15px; line-height: 1.55; font-weight: 500; }
.step-nav > .icon { width: 13px; height: 13px; color: #d9ed98; }
.nav-divider { font-size: 11px; color: #8b9fc5; letter-spacing: 1.1px; margin: 23px 14px 8px; }
.revisit-dot { width: 5px; height: 5px; flex: none; border-radius: 50%; background: #f2b578; }
.sidebar-foot { margin: 25px 9px 0; padding-top: 23px; border-top: 1px solid #2b3b60; display: flex; gap: 11px; align-items: flex-start; }
.case-symbol { width: 32px; height: 35px; background: #243660; color: #9bb0db; display: grid; place-items: center; border-radius: 8px; flex: none; }
.case-symbol .icon { width: 16px; }
.sidebar-foot span { font-size: 8px; color: #7184ae; letter-spacing: 1.5px; }
.sidebar-foot h2 { font-size: 12px; margin-top: 4px; color: #c6d2ec; font-weight: 500; }
.sidebar-foot p { font-size: 9px; color: #6e82ad; margin-top: 4px; }
.main-shell { margin-left: 270px; min-height: 100vh; background: radial-gradient(ellipse at 95% 12%, #d5dbfc 0%, transparent 46%), radial-gradient(ellipse at 0% 100%, #e3e8d9 0%, transparent 45%), #e4e9f6; }
.topbar { height: 93px; padding: 0 44px; background: #eef1fc; border-bottom: 1px solid #cdd7ee; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.page-identity > span { display: block; font-size: 10px; color: #6a7ca2; margin-bottom: 3px; }
.page-identity h2 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
.top-actions { display: flex; align-items: center; gap: 15px; }
.save-status { display: flex; align-items: center; gap: 7px; color: #63789a; font-size: 11px; margin-right: 8px; }
.save-indicator { width: 5px; height: 5px; border-radius: 50%; background: #76a792; }
.save-status.warn { color: #b27543; max-width: 160px; line-height: 1.5; }
.warn .save-indicator { background: #d49c64; }
.language-switch { display: flex; padding: 3px; background: #f1f4fb; border: 1px solid #e7ebf5; border-radius: 9px; }
.language-switch button { font-size: 11px; padding: 5px 9px; border-radius: 6px; color: #9ba6bc; }
.language-switch .selected { background: white; color: var(--blue); box-shadow: 0 1px 5px #18254b0d; font-weight: 600; }
.material-button { padding: 9px 13px; font-size: 12px; background: #dde6ff; border-color: #cbd7f8; color: #355cf4; }
.material-button .icon { width: 16px; }
.workspace-layout { max-width: 1180px; margin: 0 auto; padding: 34px 44px 40px; }
.step-hero { position: relative; display: flex; align-items: center; overflow: hidden; min-height: 221px; padding: 31px 36px; border-radius: 19px; background: linear-gradient(112deg, #2b4fd9 0%, #4265ee 64%, #6456d9 100%); color: white; box-shadow: 0 10px 25px #355cf415; }
.hero-copy { position: relative; z-index: 1; flex: 1; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 400; letter-spacing: .6px; color: #adbeff; }
.hero-badge { display: inline-block; border-radius: 6px; padding: 4px 9px; background: #d9ed98; color: #233a74; font-size: 10px; letter-spacing: 1px; font-weight: 700; }
.step-hero h1 { font-size: clamp(29px, 2.5vw, 39px); letter-spacing: -1.1px; line-height: 1.4; margin: 21px 0 12px; font-weight: 650; }
.step-hero p { font-size: 13px; line-height: 1.8; color: #c4d0ff; max-width: 620px; }
.hero-art { flex: none; width: 245px; height: 200px; margin: -23px -19px -23px 12px; }
.workspace-heading { display: flex; align-items: center; justify-content: space-between; min-height: 39px; margin: 30px 0 16px; gap: 15px; }
.workspace-heading h2 { font-size: 17px; letter-spacing: -.2px; }
.entries { display: grid; gap: 17px; }
.empty-state { border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(125deg, #eef1ff 0%, #e4e9fc 58%, #f3eddf 100%); padding: 28px 25px 32px; text-align: center; box-shadow: 0 4px 16px #18325603; }
.empty-art { width: 74px; height: 74px; margin: 0 auto 15px; }
.empty-art svg { width: 100%; height: 100%; }
.empty-state h3 { font-size: 17px; margin-bottom: 7px; }
.empty-state p { font-size: 12px; color: #637398; line-height: 1.8; max-width: 430px; margin: 0 auto 22px; }
.empty-state p:last-child { margin-bottom: 0; }
.empty-state .button { padding: 10px 22px; }
.entry-card, .review-card { padding: 23px 26px; background: #f0f2fc; border: 1px solid #c8d3ee; border-radius: 15px; box-shadow: 0 7px 24px #233d7610; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 19px; }
.card-head > div { display: flex; align-items: center; gap: 9px; }
.entry-number { font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 650; color: #728ff7; width: 27px; height: 27px; display: grid; place-items: center; background: #edf1ff; border-radius: 7px; }
.entry-label { font-size: 11px; color: #546b9a; font-weight: 500; }
.card-head .icon-button { color: #a6b1c8; }
.field { display: block; margin: 0 0 19px; }
.field:last-child { margin-bottom: 0; }
.field > span { display: block; margin-bottom: 9px; font-size: 12px; color: #586e96; font-weight: 500; }
.field input, .field textarea, .field select, select[data-review] { width: 100%; padding: 12px 15px; border: 1px solid #c7d2eb; border-radius: 10px; background: #e5ebf9; font-size: 14px; line-height: 1.85; transition: border-color .15s; }
.field textarea { resize: vertical; display: block; min-height: 119px; }
.field input, .field select { min-height: 43px; padding: 9px 13px; }
.field textarea::placeholder, .field input::placeholder { color: #7b8cad; font-size: 13px; }
.entry-details { margin-top: 16px; border-top: 1px solid #d8e0f1; }
.entry-details > summary { padding: 15px 0 2px; font-size: 11px; color: #697ba1; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 7px; }
.entry-details > summary:before { content: '+'; font-size: 16px; color: #93a8de; }
.entry-details[open] > summary:before { content: '−'; }
.entry-details > summary span { font-size: 9px; background: #f4f6fc; color: #a5b0c5; padding: 0 5px; border-radius: 3px; }
.entry-details .field { margin-top: 14px; }
.entry-details .field > span { display: none; }
.step-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding-top: 23px; margin-top: 26px; border-top: 1px solid var(--line); }
.step-footer .button { font-size: 12px; padding: 10px 16px; }
.review-toggle { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #697da5; padding: 9px; border-radius: 8px; }
.review-toggle:hover { background: #edf1fc; color: #5a78d5; }
.review-toggle .icon { width: 14px; height: 14px; }
.review-toggle.is-reviewed { color: #355cf4; background: #edf1ff; }
.two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two-columns .field { margin-bottom: 0; }
.check { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; margin: 12px 0; cursor: pointer; color: #69799a; }
.check input { accent-color: var(--blue); margin-top: 4px; width: 15px; height: 15px; flex: none; }
.entry-card h3 { font-size: 16px; line-height: 1.75; margin: 12px 0 18px; }
.is-core { border-color: #b7c8ff; box-shadow: inset 3px 0 #355cf4; }
.tag { display: inline-block; padding: 3px 8px; background: #eef2ff; color: #5d7bca; border-radius: 5px; font-size: 10px; }
.tag.green { background: #e9f2dd; color: #5b7741; }
.tag.muted { background: #f1f4fc; color: #92a0b9; }
.record-id { display: none; }
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 15px 19px; background: #fff4e9; border: 1px solid #f8e5d3; color: #b48b66; border-radius: 10px; font-size: 12px; }
.notice strong { font-size: 12px; font-weight: 400; }
.notice .icon { width: 16px; height: 16px; margin-top: 2px; }
.notice p { font-size: 12px; }
.fact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.fact-column { padding: 17px; border-radius: 12px; background: #edf2ff; border: 1px solid #e2e9fc; min-width: 0; }
.fact-column:nth-child(2) { background: #f1eefb; border-color: #e8e2f9; }
.fact-column:nth-child(3) { background: #edf4f1; border-color: #deeee5; }
.section-label { display: flex; justify-content: space-between; font-size: 11px; color: #7888a7; gap: 8px; }
.section-label span { font-size: 10px; opacity: .65; }
.column-empty { font-size: 11px; color: #a1abc1; padding: 25px 0 13px; }
.fact-card { border: 1px solid var(--line); border-radius: 9px; background: white; padding: 14px; margin-top: 13px; }
.fact-card p { font-size: 12px; margin: 9px 0; }
.fact-card small, .library-card small { color: #9ba8bf; font-size: 10px; display: block; margin: 10px 0; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0 0; }
.section-heading h3 { font-size: 14px; }
.basis-box { border-top: 1px solid var(--line); padding-top: 15px; }
.basis-box > p { font-size: 12px; color: #94a0b6; margin: 9px 0; }
.relation { display: flex; align-items: flex-start; gap: 9px; border-top: 1px solid var(--line); padding: 13px 0; font-size: 12px; }
.relation > .icon { width: 14px; height: 14px; color: #829ae0; margin-top: 3px; }
.relation > div { flex: 1; min-width: 0; }
.relation strong { font-weight: 500; color: #6c7c9d; }
.relation p { font-size: 11px; margin-top: 4px; color: #9ba6bc; }
.word-shelf { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 5px; }
.word-shelf > span { font-size: 11px; margin-right: 6px; color: #9ba6bc; }
.word-chip { display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 7px; background: #e9efff; border: 1px solid #e0e7fc; color: #6484d1; font-size: 11px; }
.word-chip:nth-of-type(2) { background: #efeafb; color: #9374c2; border-color: #e9e1f8; }
.word-chip:nth-of-type(3) { background: #e7f3ef; color: #5c9f8b; border-color: #d9eee5; }
.word-chip:nth-of-type(4) { background: #fff0e5; color: #c29168; border-color: #f8e6d7; }
.word-chip:hover { filter: brightness(.97); }
.word-chip .icon { width: 12px; height: 12px; }
.rank-heading { display: flex; align-items: center; gap: 12px; margin: 5px 0 19px; }
.rank-heading h3 { flex: 1; margin: 0; font-size: 16px; }
.rank-number { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 9px; background: #edf1ff; color: #5878e1; font-size: 14px; font-weight: 600; }
.rank-controls { display: flex; gap: 3px; }
fieldset { border: 1px solid var(--line); border-radius: 9px; padding: 12px 16px; margin: 16px 0 20px; }
legend { font-size: 11px; color: #8e9bb5; padding: 0 6px; }
.analysis-extra { background: #eff3fc; padding: 0 19px 16px; border: 1px solid #e2e8f5; border-radius: 12px; }
.analysis-extra:not([open]) { padding-bottom: 0; }
.analysis-extra > summary { padding: 14px 0; font-size: 12px; color: #8190b0; cursor: pointer; }
.analysis-extra > summary span { float: right; font-size: 10px; margin-right: 3px; }
.analysis-extra > .entry-card { margin-top: 14px; }
.analysis-extra .section-heading { margin: 5px 0 13px; }
.hint { color: #98a3bb; font-size: 12px; line-height: 1.85; }
.review-prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 10px 0; }
.review-prompt { display: flex; align-items: center; gap: 8px; text-align: left; border-radius: 8px; padding: 13px; background: white; color: #7890b8; font-size: 11px; }
.review-prompt span { flex: 1; }
.review-prompt .icon { width: 14px; }
.review-card h3 { font-size: 14px; line-height: 1.8; margin: 0 0 17px; }
.review-actions { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.review-actions select { width: auto; font-size: 11px; padding: 8px 12px; }
/* Materials appear on demand, never as a competing permanent column. */
dialog { width: min(540px, calc(100% - 32px)); max-height: 87vh; border: 1px solid #e1e7f6; border-radius: 18px; background: white; color: var(--ink); padding: 0; box-shadow: 0 24px 100px #14244b30; }
dialog::backdrop { background: #111f4b66; backdrop-filter: blur(4px); }
#modal-content { padding: 28px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 24px; }
.modal-head h2 { font-size: 20px; }
.modal-message { font-size: 14px; line-height: 1.9; }
.modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 23px; }
.drawer { margin: 0 0 0 auto; inset: 0 0 0 auto; width: min(530px, 100%); height: 100vh; max-height: 100vh; border-radius: 20px 0 0 20px; }
.drawer #modal-content { padding: 32px; }
.drawer-tabs { display: flex; flex-wrap: wrap; gap: 7px; padding-bottom: 17px; margin-bottom: 23px; border-bottom: 1px solid var(--line); }
.drawer-tabs button { border-radius: 7px; padding: 7px 11px; color: #9aa6be; font-size: 11px; }
.drawer-tabs .selected { color: var(--blue); background: #eaf0ff; font-weight: 600; }
.library-card { border: 1px solid var(--line); padding: 19px; border-radius: 12px; background: #fafbff; margin: 12px 0; }
.library-card h3 { font-size: 15px; margin: 11px 0 9px; }
.library-card p { font-size: 12px; line-height: 1.9; color: #7d8ba7; }
.library-card > .tag { margin-left: 5px; }
.library-card details { font-size: 11px; color: #9ca8bf; margin: 12px 0; }
.library-card details summary { cursor: pointer; }
.library-card details p { margin-top: 9px; }
.principle-group { margin: 20px 0; }
.principle-group > summary { cursor: pointer; font-size: 13px; padding: 13px 0; border-top: 1px solid var(--line); }
.principle-group > summary span { float: right; color: #9eabc2; font-size: 11px; }
.tools-list { display: grid; gap: 8px; }
.tools-list .button { justify-content: flex-start; padding: 13px 17px; font-size: 13px; border-color: #eff2f9; box-shadow: none; }
.tools-list .danger { color: #c58b88; margin-top: 10px; }
.tools-list .button .icon { color: #8ea3d5; }
.method-reference { padding: 20px 0; margin: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.method-reference .hint { margin-top: 12px; font-size: 11px; }
.reminders { background: #f2f5fd; border: 1px solid var(--line); border-radius: 9px; margin-top: 20px; }
.reminders summary { display: flex; gap: 7px; align-items: center; padding: 14px; font-size: 12px; color: #8a9bb9; cursor: pointer; }
.reminders summary span { margin-left: auto; font-size: 10px; }
.reminders button { display: flex; gap: 10px; align-items: flex-start; text-align: left; border-top: 1px solid var(--line); width: 100%; font-size: 11px; line-height: 1.8; padding: 12px 14px; }
.reminders .tag { flex: none; }
.reminders > p { padding: 12px 14px; font-size: 11px; color: #91a1bc; }
.quote { border-left: 3px solid #668aff; padding: 16px 19px; background: #f0f4ff; font-size: 13px; margin-bottom: 22px; }
.export-choices, .help-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.timeline { padding-left: 22px; border-left: 1px solid #c4d2fb; margin-left: 8px; }
.timeline article { padding-bottom: 25px; }
.timeline time { font-size: 11px; color: #8d9dbc; }
.timeline h3 { font-size: 14px; margin: 8px 0; }
.timeline small { font-size: 11px; color: #a1aec4; }
#toast { position: fixed; bottom: 28px; left: calc(50% + 135px); transform: translate(-50%, 8px); padding: 12px 22px; background: #1e3472; color: white; border-radius: 10px; box-shadow: 0 10px 30px #152c7420; z-index: 100; opacity: 0; pointer-events: none; font-size: 12px; transition: opacity .2s, transform .2s; max-width: 90vw; }
#toast.visible { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 1700px) { .workspace-layout { padding-top: 44px; } .step-hero { min-height: 250px; padding-left: 43px; } .step-hero h1 { font-size: 43px; } }
@media (max-width: 1200px) {
  .sidebar { width: 246px; padding: 26px 15px 21px; }
  .main-shell { margin-left: 246px; }
  .brand { font-size: 23px; padding: 0 9px; }
  .topbar { padding: 0 30px; }
  .top-actions { gap: 10px; }
  .save-status { display: none; }
  .workspace-layout { padding: 30px; }
  .step-hero { padding: 27px; }
  .hero-art { width: 185px; height: 180px; margin-left: 2px; }
  .step-hero h1 { font-size: 30px; }
  #toast { left: calc(50% + 123px); }
}
@media (max-width: 820px) {
  .sidebar { position: relative; width: 100%; padding: 18px 22px 0; }
  .brand { font-size: 23px; padding: 0; }
  .brand-mark { width: 32px; height: 36px; border-radius: 9px; }
  .brand-mark .icon { width: 20px; }
  .brand-sub { font-size: 9px; margin-top: 4px; }
  .sidebar nav { display: flex; gap: 7px; padding: 17px 0 12px; overflow-x: auto; }
  .nav-heading, .nav-divider, .sidebar-foot { display: none; }
  .step-nav { width: auto; flex: none; padding: 9px 12px; gap: 9px; margin: 0; }
  .step-index { width: auto; font-size: 12px; }
  .step-name { font-size: 13px; }
  .main-shell { margin-left: 0; }
  .topbar { height: 74px; padding: 0 24px; }
  .page-identity h2 { font-size: 13px; }
  .page-identity > span { font-size: 9px; }
  .top-actions { gap: 10px; }

/* Case packs and workspace selection live outside the frozen v2 analysis state.
 * Each pack uses the existing CASE_DATA schema. No case judgments are generated.
 */
(function () {
  'use strict';
  var template = window.CASE_DATA;
  var catalogKey = 'fieldnotes.ui.case-catalog.v1';
  var clone = function (value) { return JSON.parse(JSON.stringify(value)); };
  var packs = {}, active = template.meta.id, catalogWritable = true, recovery = null;
  var arrays = ['sources', 'timeline', 'facts', 'principles', 'valueWords', 'constraints', 'biasChecks', 'reviewPrompts', 'steps'];
  packs[template.meta.id] = template;

  function validPack(pack) {
    try {
    if (!pack || !pack.meta || !/^[a-z0-9][a-z0-9-]{0,100}$/.test(pack.meta.id) ||
        typeof pack.meta.title !== 'string' || !pack.meta.title.trim() || pack.meta.dataVersion !== '2.0' ||
        typeof pack.meta.builtAt !== 'string' || arrays.some(function (key) { return !Array.isArray(pack[key]); })) return false;
    var ids = new Set();
    if (arrays.filter(function (key) { return key !== 'steps'; }).some(function (key) {
      return pack[key].some(function (entry) {
        if (!entry || typeof entry.id !== 'string' || ids.has(entry.id)) return true;
        ids.add(entry.id); return false;
      });
    })) return false;
    var sources = new Set(pack.sources.map(function (s) { return s.id; }));
    return pack.steps.length === 10 && pack.steps.every(function (step, i) { return step && step.id === i + 1; }) &&
      pack.sources.every(function (s) { return typeof s.title === 'string' && typeof s.publisher === 'string' && Number.isInteger(s.year); }) &&
      pack.facts.every(function (f) { return typeof f.text === 'string' && Array.isArray(f.categories) && f.categories.length && f.categories.every(function (c) { return ['material', 'individual', 'organization'].includes(c); }) && sources.has(f.sourceId); }) &&
      pack.principles.every(function (p) { return typeof p.name === 'string' && typeof p.nameEn === 'string' && typeof p.desc === 'string'; }) &&
      pack.valueWords.every(function (w) { return typeof w.word === 'string' && typeof w.whyVague === 'string'; }) &&
      pack.constraints.every(function (c) { return typeof c.label === 'string'; }) &&
      pack.biasChecks.concat(pack.reviewPrompts).every(function (p) { return typeof p.label === 'string' && Number.isInteger(p.jumpTo) && p.jumpTo >= 1 && p.jumpTo <= 10; });
    } catch (error) { return false; }
  }

  try {
    var raw = localStorage.getItem(catalogKey);
    if (raw) {
      var saved = JSON.parse(raw);

      saved.cases.forEach(function (pack) { if (pack.meta.id !== template.meta.id) packs[pack.meta.id] = pack; });
      if (Object.prototype.hasOwnProperty.call(packs, saved.active)) active = saved.active;
    }
  } catch (error) { catalogWritable = false; recovery = raw || null; }

  function saveCatalog() {
    if (!catalogWritable) return false;
    try {
      localStorage.setItem(catalogKey, JSON.stringify({ format: 'fieldnotes-catalog-v1', active: active,
        cases: Object.values(packs).filter(function (pack) { return pack.meta.id !== template.meta.id; }) }));
      return true;
    } catch (error) { return false; }
  }
  function storageKey(id) {
    return id === template.meta.id ? 'engr4960j.frontend.preview.v2' : 'fieldnotes.ui.case.' + id + '.v2';
  }
  var runtime = window.CASE_RUNTIME || window.FrontendPreviewRuntime.create(packs[active], { key: storageKey(active) });
  var metadataSaved = saveCatalog();

  function select(id) {
    if (!Object.prototype.hasOwnProperty.call(packs, id)) return false;
    if (runtime.flush) runtime.flush();
    active = id;
    runtime = window.FrontendPreviewRuntime.create(packs[id], { key: storageKey(id) });
    metadataSaved = saveCatalog();
    return true;
  }
  function create(title) {
    if (typeof title !== 'string' || !title.trim()) throw new Error('A case name is required');
    var pack = clone(template);
    var id = 'case-' + Date.now().toString(36);
    while (packs[id]) id += '-1';
    pack.meta = { id: id, title: title.trim(), dataVersion: '2.0', builtAt: new Date().toISOString().slice(0, 10) };
    pack.facts = []; pack.timeline = [];
    pack.sources = template.sources.filter(function (source) { return pack.principles.some(function (p) { return p.sourceId === source.id; }); });
    // Case-specific interpretive references must not leak into a new case.

    packs[id] = pack;
    select(id);
    return id;
  }

    var savedState = runtime.getState();
    if (runtime.flush) runtime.flush();
    runtime = window.FrontendPreviewRuntime.create(pack, { key: storageKey(active), state: savedState });
    return true;
  }
  function exportProject() {
    if (active === template.meta.id) return runtime.exportProject();
    return JSON.stringify({ format: 'fieldnotes-project-v1', caseData: packs[active], state: runtime.getState() }, null, 2);
  }
  function importProject(json) {
    var input;
    try { input = typeof json === 'string' ? JSON.parse(json) : clone(json); } catch (error) { return { ok: false }; }

    var result = candidate.importProject(payload);
    candidate.flush();
    if (!result.ok) return result;
    // Validation completes before touching any active draft or catalog.
    if (runtime.flush) runtime.flush();
    packs[pack.meta.id] = pack;
    active = pack.meta.id;
    runtime = window.FrontendPreviewRuntime.create(pack, { key: storageKey(active), state: result.state });
    metadataSaved = saveCatalog();
    return { ok: true };
  }
  window.FieldnotesCases = {
    getData: function () { return packs[active]; }, getRuntime: function () { return runtime; },
    list: function () { return Object.values(packs).map(function (pack) { return { id: pack.meta.id, title: pack.meta.title }; }); },
    select: select, create: create, addFact: addFact, importProject: importProject, exportProject: exportProject,
    isCustom: function () { return active !== template.meta.id; },
    getSaveStatus: function () { return metadataSaved ? (runtime.getSaveStatus ? runtime.getSaveStatus() : 'unknown') : 'memory'; },
    mount: function (instance) { if (runtime.flush) runtime.flush(); runtime = instance; },
    recoveryData: function () { return recovery; }
  };
})();

  function toast(message){var box=document.getElementById('toast');box.textContent=message;box.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(function(){box.classList.remove('visible');},3500);}
  function openDialog(titleKey,body,drawer){if(modal.open)modal.close();modal.className=drawer?'drawer':'';modalContent.innerHTML='<div class="modal-head"><h2>'+esc(t(titleKey))+'</h2>'+button('close','close','icon-button quiet','close','aria-label="'+esc(t('close'))+'"')+'</div>'+body;modal.showModal();}
  function confirmAction(message,action){openDialog('help','<p class="modal-message">'+esc(message)+'</p><div class="modal-actions">'+button('cancel','close','quiet')+'<button class="button primary" data-action="confirm">'+esc(t('confirm'))+'</button></div>');modal.confirmHandler=action;}
  function dispatch(type,payload){engine.dispatch({type:type,payload:payload});}
  function options(records){return '<option value="">'+esc(t('choose'))+'</option>'+records.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(display(x)||x.title||x.id)+'</option>';}).join('');}
  function materialBody(tab){var tabs=['timeline','facts','principles','sources','glossary'];var body='<div class="drawer-tabs">'+tabs.map(function(k){return '<button data-action="material-tab" data-tab="'+k+'" class="'+(tab===k?'selected':'')+'">'+esc(t(k))+'</button>';}).join('')+'</div>';
    if(tab==='principles')body+='<p class="hint">'+esc(t('sourceTranslation'))+' · 23 '+bi('条原则 + 10 项权利','principles + 10 rights')+'</p>'+['basic','organization','employee','involvement','rights'].map(function(group){return '<details class="principle-group" '+(group==='basic'?'open':'')+'><summary>'+esc(t(group))+'<span>'+data.principles.filter(function(p){return p.group===group;}).length+'</span></summary>'+data.principles.filter(function(p){return p.group===group;}).map(function(p){var chosen=rows('PA').some(function(it){return it.principleId===p.id;});return '<article class="library-card"><span class="record-id">'+esc(p.id)+'</span>'+tag(group==='rights'?'rights':'textbook','muted')+'<h3>'+esc(principleName(p.id))+'</h3><p>'+esc(locale==='zh'?p.desc:p.nameEn)+'</p><details><summary>'+esc(t('sourceOriginal'))+'</summary><p>'+esc(p.nameEn)+'</p><small>'+esc(sourceName(p.sourceId))+'</small></details>'+(!presentation?button(chosen?'selected':'add','principle','small '+(chosen?'quiet':'primary'),chosen?'check':'plus','data-id="'+p.id+'" '+(chosen?'disabled':'')):'')+'</article>';}).join('')+'</details>';}).join('');
    if(tab==='timeline'){var timeline=data.timeline.filter(function(x){return !isPending(x.event);});body+=timeline.length?'<div class="timeline">'+timeline.map(function(x){return '<article><time>'+esc(x.date)+'</time><h3>'+esc(x.event)+'</h3><small>'+esc(sourceName(x.sourceId))+'</small></article>';}).join('')+'</div>':empty('noData','noDataSub');}
    if(tab==='facts')body+=(cases.isCustom()?button('addFact','add-fact','primary','plus'):'');
    if(tab==='facts')body+=facts().length?facts().map(function(f){return '<article class="library-card">'+tag(cases.isCustom()?'userFact':'facts','green')+'<p>'+esc(f.text)+'</p><div>'+f.categories.map(function(c){return tag(c);}).join(' ')+'</div><small>'+esc(sourceName(f.sourceId))+'</small>'+connectButton(f)+'</article>';}).join(''):empty('noData','noDataSub');
    if(tab==='sources')body+=data.sources.map(function(s){var url=/^https?:\/\//i.test(s.url||'')?s.url:'';return '<article class="library-card"><span class="record-id">'+esc(s.id)+'</span><h3>'+esc(s.title)+'</h3><p>'+esc(s.publisher)+' · '+esc(s.year)+'</p>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(t('readSource'))+' ↗</a>':'')+'</article>';}).join('');
    if(tab==='glossary')body+='<article class="library-card"><h3>'+esc(t('methodBasis'))+'</h3><p>'+esc(t('countNote'))+'</p>'+tag('textbook')+'</article>'+data.valueWords.map(function(w,idx){return '<article class="library-card"><h3>'+esc(locale==='zh'?w.word:I.words[idx]?I.words[idx][0]:w.word)+'</h3><p>'+esc(locale==='zh'?w.whyVague:I.words[idx]?I.words[idx][1]:w.whyVague)+'</p>'+tag('team','muted')+' <small>'+esc(t('pendingSource'))+'</small></article>';}).join('');
    if(tab==='principles')body+=button('addCustom','custom-principle','quiet','plus');
    return body;
  }
  function openMaterials(tab){openDialog('materials',materialBody(tab||'timeline'),true);}
  function linkDialog(id){var source=state().items[id]||data.facts.find(function(f){return f.id===id;});if(!rows('Q').length){toast(t('noTargets'));return;}openDialog('linkEvidence','<form id="link-form" data-from="'+esc(id)+'"><p class="quote">'+esc(display(source))+'</p><label class="field"><span>'+esc(t('questionTarget'))+'</span><select name="target" required>'+options(rows('Q'))+'</select></label><label class="field"><span>'+esc(t('whyRelated'))+'</span><textarea name="why" placeholder="'+esc(t('whyHint'))+'" required></textarea></label><div class="modal-actions">'+button('cancel','close','quiet')+'<button class="button primary" type="submit">'+esc(t('save'))+'</button></div></form>');}
  function basisDialog(id){var it=state().items[id],rel=state().relations.find(function(r){return r.from===id&&r.kind==='assumption-fills-gap';});var refs=rows('M').concat(facts(),data.sources);openDialog('basis','<form id="basis-form" data-id="'+esc(id)+'"><label class="field"><span>'+esc(t('selectGap'))+'</span><select name="gap" required>'+options(rows('M'))+'</select></label><fieldset><legend>'+esc(t('basis'))+'</legend>'+refs.map(function(x){return '<label class="check"><input name="basis" type="checkbox" value="'+esc(x.id)+'" '+((it.basisRefs||[]).includes(x.id)?'checked':'')+'>'+esc(display(x)||x.title)+'</label>';}).join('')+'</fieldset><label class="field"><span>'+esc(t('basisWhy'))+'</span><textarea name="why" required>'+esc(rel?rel.why:'')+'</textarea></label><div class="modal-actions">'+button('cancel','close','quiet')+'<button class="button primary" type="submit">'+esc(t('save'))+'</button></div></form>');if(rel)modal.querySelector('[name="gap"]').value=rel.to;}
  function exportMarkdown(){var s=state(),text='# '+data.meta.title+'\n\n'+t('exportDisclaimer')+'\n';for(var step=1;step<=10;step++){text+='\n## '+step+'. '+title(step)+'\n\n';rows(null,s).filter(function(it){return it.step===step;}).forEach(function(it){text+='### '+it.id+'\n\n'+snapshotText(it)+'\n\n';});if(step===2)rows('Q',s).filter(function(q){return q.isCore;}).forEach(function(q){text+='- '+q.text+'\n  '+(q.focusReason||'')+'\n';});if(step===3){var linked=data.facts.filter(function(f){return !isPending(f.text)&&s.relations.some(function(r){return r.from===f.id;});});linked.forEach(function(f){text+='### '+f.id+'\n\n'+f.text+'\n\n'+t('source')+': '+sourceName(f.sourceId)+'\n\n';});}if(step===6)s.conflicts.forEach(function(c){text+='### '+c.id+'\n\n'+snapshotText(c)+'\n';});}text+='\n## '+t('links')+'\n\n'+s.relations.map(function(r){return '- '+r.from+' → '+r.to+'\n  '+r.why;}).join('\n')+'\n\n## '+t('notes')+'\n'+s.authorship.notes.concat(s.authorship.reservations).join('\n\n');return text;}
  function download(text,name,type){var url=URL.createObjectURL(new Blob([text],{type:type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url);},2000);}
  function exportDialog(){var list=[];for(var step=1;step<=10;step++)list=list.concat(warnings(step));openDialog('export','<p class="hint">'+esc(t('exportReminder'))+'</p><details class="reminders"><summary>'+list.length+' '+esc(t('reminders'))+'</summary>'+list.map(function(w){return '<p>'+esc(t('step'))+' '+w.step+' · '+esc(warningMessage(w))+'</p>';}).join('')+'</details><p class="hint">'+esc(t('exportDisclaimer'))+'</p><div class="export-choices">'+button('jsonExport','download-json','primary','download')+button('markdown','download-md','','note')+'</div>');}
  function onClick(event){var el=event.target.closest('[data-action]');if(!el||el.disabled)return;var action=el.dataset.action;event.preventDefault();
    if(presentation && ['add','delete','link','basis','concept','constraint','principle','conflict','answer','snapshot','restore','rank','no-constraints','import','reset','mock','revision-note'].includes(action))return;
    if(action==='tools')toolsDialog();
    if(action==='cases')casesDialog();
    if(action==='select-case'){cases.select(el.dataset.id);attachCase();modal.close();}
    if(action==='add-fact')factDialog();
    if(action==='method')methodDialog();
    if(action==='review-step')dispatch('SET_STATUS',{step:current(),status:state().stepStatus[current()]==='checked'?'draft':'checked'});
    if(action==='navigate'){view='workbook';if(modal.open)modal.close();var target=Math.max(1,Math.min(10,Number(el.dataset.step)));if(presentation){presentationStep=target;render();}else dispatch('NAVIGATE',{step:target});window.scrollTo(0,0);if(el.dataset.id)setTimeout(function(){var item=document.getElementById('entry-'+el.dataset.id);if(item)item.scrollIntoView({block:'center',behavior:'smooth'});},0);}
    if(action==='language'){locale=el.dataset.lang;try{localStorage.setItem('fieldnotes.ui.language',locale);}catch(e){}render();if(modal.open)modal.close();}
    if(action==='add'){dispatch('ADD_ITEM',{type:el.dataset.type,step:Number(el.dataset.step),fields:el.dataset.type==='C'?{word:'',others:'',mine:''}:el.dataset.type==='PA'?{order:rows('PA').length+1}:undefined});var items=rows(el.dataset.type),last=items[items.length-1];setTimeout(function(){var input=document.querySelector('[data-item="'+last.id+'"]');if(input)input.focus();},0);}
    if(action==='delete'){var it=state().items[el.dataset.id];var dependencies=engine.affected?engine.affected(it.id):[];var impacts=Array.from(new Set(dependencies.map(function(id){return state().items[id]?state().items[id].step:null;}).filter(Boolean)));confirmAction(t((state().relations.some(function(r){return r.from===it.id||r.to===it.id;})||(engine.affected&&engine.affected(it.id).length))?'deleteLinked':'deleteConfirm')+(impacts.length?' '+t('step')+' '+impacts.join(', '):''),function(){dispatch('DELETE_ITEM',{id:it.id});});}
    if(action==='delete-conflict')confirmAction(t('deleteConfirm'),function(){dispatch('DELETE_CONFLICT',{id:el.dataset.id});});
    if(action==='close'){modal.close();modal.confirmHandler=null;}
    if(action==='confirm'){var fn=modal.confirmHandler;modal.close();modal.confirmHandler=null;if(fn)fn();}
    if(action==='materials')openMaterials(el.dataset.tab);
    if(action==='material-tab')modalContent.innerHTML='<div class="modal-head"><h2>'+esc(t('materials'))+'</h2>'+button('close','close','icon-button quiet','close')+'</div>'+materialBody(el.dataset.tab);
    if(action==='link') {if(modal.open)modal.close();linkDialog(el.dataset.id);}
    if(action==='unlink')dispatch('UNLINK',{id:el.dataset.id});
    if(action==='basis')basisDialog(el.dataset.id);
    if(action==='concept')dispatch('ADD_ITEM',{type:'C',step:5,fields:{word:el.dataset.word,others:'',mine:''}});
    if(action==='constraint')dispatch('ADD_ITEM',{type:'RC',step:9,fields:{text:el.dataset.text}});
    if(action==='no-constraints')dispatch('ADD_ITEM',{type:'RC',step:9,fields:{checkedIds:['none'],text:''}});
    if(action==='custom-principle'){modal.close();dispatch('ADD_ITEM',{type:'PA',step:6,fields:{order:rows('PA').length+1}});dispatch('NAVIGATE',{step:6});}
    if(action==='principle'){dispatch('ADD_ITEM',{type:'PA',step:6,fields:{principleId:el.dataset.id,appliesTo:[],order:rows('PA').length+1}});modal.close();view='workbook';dispatch('NAVIGATE',{step:6});}
    if(action==='rank'){var list=rows('PA').sort(function(a,b){return(a.order||0)-(b.order||0);}),idx=list.findIndex(function(x){return x.id===el.dataset.id;}),dest=idx+Number(el.dataset.direction);if(dest>=0&&dest<list.length){var other=list[dest];list[dest]=list[idx];list[idx]=other;list.forEach(function(x,i){dispatch('UPDATE_ITEM',{id:x.id,fields:{order:i+1}});});}}
    if(action==='conflict'){var entries=rows('PA').map(function(it){return{id:it.principleId||it.id,text:principleName(it.principleId)||it.text||t('custom')};});openDialog('addConflict','<form id="conflict-form"><label class="field"><span>'+esc(t('questionTarget'))+'</span><select name="question" required>'+options(rows('Q'))+'</select></label><div class="two-columns"><label class="field"><span>'+esc(t('principleA'))+'</span><select name="a" required>'+options(entries)+'</select></label><label class="field"><span>'+esc(t('principleB'))+'</span><select name="b" required>'+options(entries)+'</select></label></div><button type="submit" class="button primary">'+esc(t('addConflict'))+'</button></form>');}
    if(action==='answer')dispatch('ANSWER',{question:el.dataset.id});
    if(action==='reference'){if(presentation)return;dispatch('ACCEPT_L3',{step:current()});var ref=data.steps[current()-1].referenceLevel3;openDialog('reference','<p class="notice">'+esc(t('referenceDisclaimer'))+'</p>'+tag('textbook')+'<p>'+esc(!ref||isPending(ref.body)?t('referencePending'):ref.body)+'</p><small>'+esc(t('methodBasis'))+' · '+esc(data.meta.builtAt)+'</small>',true);}
    if(action==='export')exportDialog();
    if(action==='download-json'){download(cases.exportProject(),data.meta.id+'-project.json','application/json');modal.close();}
    if(action==='download-md'){download(exportMarkdown(),data.meta.id+'-notes.md','text/markdown;charset=utf-8');modal.close();}
    if(action==='import'){modal.close();document.getElementById('project-file').click();}
    if(action==='recovery')download(cases.recoveryData()||engine.recoveryData(),data.meta.id+'-original-archive.json','application/json');
    if(action==='reset')confirmAction(t('resetConfirm'),function(){dispatch('RESET',{});toast(t('resetDone'));});
  }
  function updateInput(event){if(presentation||composing)return;var el=event.target;if(el.dataset.item||el.dataset.conflict){var key=el.dataset.field,value=el.type==='checkbox'?el.checked:el.value;if(key==='actors')value=value.split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean);if(key==='appliesTo')value=value?[value]:[];if(key==='order')value=Math.max(1,Math.min(99,Number(value)||1));var fields={};fields[key]=value;dispatch(el.dataset.conflict?'UPDATE_CONFLICT':'UPDATE_ITEM',{id:el.dataset.item||el.dataset.conflict,fields:fields});}if(el.dataset.applies){var pa=state().items[el.dataset.applies],targets=(pa.appliesTo||[]).filter(function(id){return id!==el.value;});if(el.checked)targets.push(el.value);dispatch('UPDATE_ITEM',{id:pa.id,fields:{appliesTo:targets}});}if(el.dataset.checklist){var carrier=state().items[el.dataset.checklist],ids=(carrier.checkedIds||[]).filter(function(id){return id!==el.value;});if(el.checked)ids.push(el.value);dispatch('SET_CHECKLIST',{id:carrier.id,ids:ids});}if(el.dataset.status)dispatch('SET_STATUS',{step:Number(el.dataset.status),status:el.value});if(el.dataset.review){var it=state().items[el.dataset.review];dispatch('UPDATE_ITEM',{id:it.id,fields:{review:{status:el.value,note:it.review?it.review.note||'':''}}});dispatch('SET_STATUS',{step:7,status:'draft'});if(el.value==='revise')dispatch('SET_STATUS',{step:it.step,status:'stale'});}}
  function submit(event){if(presentation){event.preventDefault();return;}var form=event.target;if(!['link-form','basis-form','conflict-form','notes-form','revision-form','case-form','fact-form'].includes(form.id))return;event.preventDefault();var fd=new FormData(form);
    if(form.id==='case-form'){var name=String(fd.get('title')).trim();if(!name)return;cases.create(name);attachCase();}
    if(form.id==='fact-form'){var categories=fd.getAll('category');if(!categories.length){toast(t('factNeedCategory'));return;}if(!String(fd.get('text')).trim()||!String(fd.get('source')).trim())return;cases.addFact(String(fd.get('text')),categories,String(fd.get('source')),Number(fd.get('year')),String(fd.get('url')));attachCase();toast(t('factSaved'));}
    if(form.id==='link-form'){if(!String(fd.get('why')).trim()){toast(t('needReason'));return;}dispatch('LINK',{from:form.dataset.from,to:fd.get('target'),kind:'fact-supports-question',why:String(fd.get('why')).trim()});}
    if(form.id==='basis-form'){if(!String(fd.get('why')).trim()){toast(t('needReason'));return;}var refs=fd.getAll('basis');if(!refs.length)refs=[fd.get('gap')];dispatch('SET_BASIS',{id:form.dataset.id,refs:refs,gap:fd.get('gap'),why:fd.get('why')});}
    if(form.id==='conflict-form'){if(fd.get('a')===fd.get('b')){toast(t('needPair'));return;}dispatch('ADD_CONFLICT',{questionId:fd.get('question'),principleA:fd.get('a'),principleB:fd.get('b'),supportsA:'',supportsB:'',priority:'',reason:'',scope:'case'});}
    if(form.id==='revision-form'){dispatch('ADD_NOTE',{kind:'note',text:new Date().toISOString()+' · '+form.dataset.id+' · '+fd.get('text')});toast(t('noteSaved'));}
    if(form.id==='notes-form'){dispatch('ADD_NOTE',{kind:fd.get('kind'),text:(fd.get('author')?fd.get('author')+' · ':'')+fd.get('text')});toast(t('noteSaved'));}modal.close();
  }
  function bindEngine(){if(unsubscribe)unsubscribe();unsubscribe=engine.subscribe(render);}
  document.addEventListener('compositionstart',function(){composing=true;});document.addEventListener('compositionend',function(e){composing=false;updateInput(e);});
  document.addEventListener('click',onClick);document.addEventListener('input',function(e){if(e.target.matches('textarea[data-item],input[data-item]:not([type="checkbox"]),textarea[data-conflict],input[data-conflict]'))updateInput(e);});document.addEventListener('change',function(e){if(e.target.matches('select[data-item],select[data-conflict],input[type="checkbox"][data-item],[data-status],[data-review],[data-checklist],[data-applies]'))updateInput(e);});document.addEventListener('submit',submit);
  document.addEventListener('dragstart',function(e){var el=e.target.closest('[data-drag]');if(el&&!presentation){dragId=el.dataset.drag;e.dataTransfer.setData('text/plain',dragId);}});
  document.addEventListener('dragover',function(e){if(e.target.closest('[data-drag]'))e.preventDefault();});
  document.addEventListener('drop',function(e){var el=e.target.closest('[data-drag]');if(!el||!dragId||presentation)return;e.preventDefault();var list=rows('PA').sort(function(a,b){return(a.order||0)-(b.order||0);}),from=list.findIndex(function(x){return x.id===dragId;}),to=list.findIndex(function(x){return x.id===el.dataset.drag;});if(from>=0&&to>=0){var row=list.splice(from,1)[0];list.splice(to,0,row);list.forEach(function(x,i){dispatch('UPDATE_ITEM',{id:x.id,fields:{order:i+1}});});}dragId=null;});
  document.getElementById('project-file').addEventListener('change',function(e){var file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){toast(t('fileLarge'));return;}var reader=new FileReader();reader.onload=function(){confirmAction(t('importConfirm'),function(){var result=cases.importProject(reader.result);if(result.ok)attachCase();toast(t(result.ok?'imported':'invalidImport'));if(result.ok){view='workbook';render();}});};reader.onerror=function(){toast(t('invalidImport'));};reader.readAsText(file);});
  window.addEventListener('pagehide',function(){if(engine.flush)engine.flush();});
  window.FIELDNOTES={mount:function(runtime){cases.mount(runtime);engine=runtime;workingEngine=runtime;presentation=null;bindEngine();render();},getEngine:function(){return engine;},getLocale:function(){return locale;},getCases:function(){return cases;},snapshotChanges:snapshotChanges};
  bindEngine();render();
})();
